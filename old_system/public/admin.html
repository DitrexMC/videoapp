<!DOCTYPE html>
<html lang="ja" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoApp — 管理画面</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/theme.js"></script>
</head>

<body>
  <canvas id="canvas"></canvas>
  <div class="page-glow page-glow-1"></div>
  <div class="page-glow page-glow-2"></div>

  <nav id="nav">
    <a class="nav-logo" href="/">VideoApp</a>
    <ul class="nav-links">
      <li><a href="/">ホーム</a></li>
      <li><a href="/upload">アップロード</a></li>
      <li><a href="/myfiles">マイファイル</a></li>
      <li><a href="/admin" class="active">管理</a></li>
    </ul>
    <div class="nav-user">
      <span id="nav-username"></span>
      <button class="theme-toggle" id="theme-toggle"></button>
      <button class="btn btn-ghost btn-sm" id="logout-btn">ログアウト</button>
    </div>
  </nav>

  <main>
    <div class="container">
      <div class="stat-tag reveal">
        <span class="stat-tag-dot"></span>
        Admin Panel
      </div>

      <div class="sec-eye reveal reveal-d1">
        <div class="sec-eye-text">
          <div class="sec-lbl">Management</div>
          <h1>管理画面</h1>
        </div>
      </div>

      <!-- Stats bar -->
      <div class="admin-stats reveal reveal-d2">
        <div class="asc">
          <div class="asc-icon"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg></div>
          <div class="asc-val" id="stat-users">—</div>
          <div class="asc-lbl">ユーザー数</div>
        </div>
        <div class="asc">
          <div class="asc-icon"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" />
              <polyline points="13 2 13 9 20 9" />
            </svg></div>
          <div class="asc-val" id="stat-files">—</div>
          <div class="asc-lbl">総ファイル数</div>
        </div>
        <div class="asc">
          <div class="asc-icon"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="12" cy="5" rx="9" ry="3" />
              <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" />
              <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
            </svg></div>
          <div class="asc-val" id="stat-storage">—</div>
          <div class="asc-lbl">総ストレージ</div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs reveal reveal-d3">
        <button class="tab-btn active" data-tab="users">ユーザー管理</button>
        <button class="tab-btn" data-tab="files">ファイル管理</button>
      </div>

      <!-- User tab -->
      <div class="tab-panel active" id="tab-users">
        <div class="card mb-2">
          <div class="section-title mb-2">新規ユーザー作成</div>
          <form id="create-user-form">
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.8rem">
              <div class="form-group">
                <label>ラベル</label>
                <input class="input" id="new-label" placeholder="表示名" required>
              </div>
              <div class="form-group">
                <label>クォータ (GB)</label>
                <input class="input" type="number" id="new-quota" placeholder="10" min="1" value="10">
              </div>
              <div class="form-group">
                <label>デフォルト保存期限 (日)</label>
                <input class="input" type="number" id="new-expiry" placeholder="なし" min="1">
              </div>
              <div class="form-group" style="justify-content:flex-end;padding-top:1.4rem">
                <label
                  style="display:flex;align-items:center;gap:.5rem;cursor:pointer;text-transform:none;font-size:.85rem">
                  <input type="checkbox" id="new-is-admin"> 管理者権限
                </label>
              </div>
            </div>
            <div id="create-user-msg" style="min-height:1.2rem;font-size:.84rem;margin-bottom:.5rem"></div>
            <button type="submit" class="btn btn-primary">ユーザーを作成</button>
          </form>
        </div>

        <div class="table-wrap">
          <table class="table admin-table">
            <colgroup>
              <col style="width:14%">
              <col style="width:24%">
              <col style="width:8%">
              <col style="width:22%">
              <col style="width:8%">
              <col style="width:24%">
            </colgroup>
            <thead>
              <tr>
                <th>ラベル</th>
                <th>Auth ID</th>
                <th>権限</th>
                <th>クォータ / 使用量</th>
                <th>状態</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="user-list">
              <tr>
                <td colspan="6" class="text-sub" style="padding:2rem;text-align:center">読み込み中...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Files tab -->
      <div class="tab-panel" id="tab-files">
        <div class="search-row">
          <input class="input" id="file-search-input" placeholder="ファイル名で検索..." type="search">
          <button class="btn btn-primary" id="file-search-btn">検索</button>
        </div>
        <div class="table-wrap">
          <table class="table admin-table">
            <colgroup>
              <col style="width:14%">
              <col style="width:24%">
              <col style="width:8%">
              <col style="width:22%">
              <col style="width:8%">
              <col style="width:24%">
            </colgroup>
            <thead>
              <tr>
                <th>ラベル</th>
                <th>Auth ID</th>
                <th>権限</th>
                <th>クォータ / 使用量</th>
                <th>状態</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="user-list">
              <tr>
                <td colspan="6" class="text-sub" style="padding:2rem;text-align:center">読み込み中...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      </div>
    </div>
  </main>

  <script src="/js/particles.js"></script>
  <script src="/js/admin.js"></script>
</body>

</html>
