<!DOCTYPE html>
<html lang="ja" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoApp — ログイン</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 0 1.5rem;
            animation: fadeUp .5s ease both;
        }

        .login-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(59, 130, 246, .1);
            border: 1px solid var(--border);
            color: var(--accent2);
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 4px 14px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-bottom: 1.4rem;
        }

        .login-tag-dot {
            width: 6px;
            height: 6px;
            background: var(--accent2);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .login-logo {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: .4rem;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(59, 130, 246, .4));
        }

        .login-sub {
            color: var(--text-sub);
            font-size: .9rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .login-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 2rem;
            box-shadow: 0 24px 64px rgba(0, 0, 0, .4);
        }

        #error-msg {
            min-height: 1.4rem;
            color: var(--red);
            font-size: .85rem;
            margin-top: .8rem;
            font-weight: 600;
        }

        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: .78rem;
            color: var(--text-sub);
        }
    </style>
    <script src="/js/theme.js"></script>
</head>

<body>
    <button class="theme-toggle" id="theme-toggle" style="position:fixed;top:1rem;right:1rem;z-index:100"></button>
    <canvas id="canvas"></canvas>
    <div class="page-glow page-glow-1"></div>
    <div class="page-glow page-glow-2"></div>

    <div class="login-wrap">
        <div class="login-tag">
            <span class="login-tag-dot"></span>
            Private File Uploader
        </div>
        <div class="login-logo">VideoApp</div>
        <div class="login-sub">Auth IDを入力してアクセスしてください</div>

        <div class="login-card">
            <form id="login-form">
                <div class="form-group">
                    <label for="auth-id">Auth ID</label>
                    <input id="auth-id" class="input" type="password" placeholder="認証IDを入力" required
                        autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary w-full" style="justify-content:center;margin-top:.5rem">
                    ログイン
                </button>
                <div id="error-msg"></div>
            </form>
        </div>

        <div class="login-footer">VideoApp — Restricted Access</div>
    </div>

    <script src="/js/particles.js"></script>
    <script src="/js/login.js"></script>
</body>

</html>
