<!DOCTYPE html>
<html lang="ja" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>videoapp — 設定</title>
    <link rel="icon" href="/icons/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">
    <script src="/js/nav-theme.js"></script>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/app.css">
    <style>
        .settings-sections {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        #msg {
            min-height: 1.4rem;
            font-size: .85rem;
            font-weight: 700;
            margin-top: .5rem;
        }

        #msg.ok {
            color: var(--green);
        }

        #msg.err {
            color: var(--red);
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <div class="page-glow page-glow-1"></div>
    <div class="page-glow page-glow-2"></div>

    <nav id="nav">
        <a class="nav-logo" href="/">videoapp</a>
        <ul class="nav-links">
            <li><a href="/">ホーム</a></li>
            <li><a href="/upload.html">アップロード</a></li>
            <li><a href="/files.html">マイファイル</a></li>
            <li><a href="/settings.html" class="active">設定</a></li>
            <li id="nav-admin-link" class="hidden"><a href="/admin.html">管理</a></li>
        </ul>
        <div class="nav-user">
            <span id="nav-username"></span>
            <button class="theme-toggle" id="theme-toggle"></button>
            <button class="btn btn-ghost btn-sm" id="logout-btn">ログアウト</button>
        </div>
    </nav>

    <main>
        <div class="container">
            <div class="stat-tag reveal"><span class="stat-tag-dot"></span>Settings</div>
            <div class="sec-eye reveal reveal-d1">
                <div class="sec-eye-text">
                    <div class="sec-lbl">Config</div>
                    <h1>設定</h1>
                </div>
            </div>

            <div class="settings-sections mt-2">
                <div class="card reveal reveal-d2">
                    <div class="section-title">アカウント情報</div>
                    <div style="display:grid;gap:.6rem;margin-top:1rem">
                        <div
                            style="display:flex;justify-content:space-between;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--border)">
                            <span
                                style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-sub)">ユーザー名</span>
                            <span id="info-username">—</span>
                        </div>
                        <div
                            style="display:flex;justify-content:space-between;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--border)">
                            <span
                                style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-sub)">権限</span>
                            <span id="info-role">—</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;align-items:center;padding:.4rem 0">
                            <span
                                style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-sub)">ストレージ</span>
                            <span id="info-storage">—</span>
                        </div>
                    </div>
                </div>

                <div class="card reveal reveal-d3">
                    <div class="section-title">セッション管理</div>
                    <p style="color:var(--text-sub);font-size:.85rem;margin-top:.4rem;margin-bottom:1rem">
                        ログイントークンを再生成するか、全セッションをログアウトします。</p>
                    <div style="display:flex;gap:.6rem;flex-wrap:wrap">
                        <button class="btn btn-outline btn-sm" id="rotate-btn">トークンを再生成</button>
                        <button class="btn btn-danger btn-sm" id="logout-all-btn">全セッションをログアウト</button>
                    </div>
                    <div id="msg"></div>
                    <div id="new-token-wrap" style="display:none;margin-top:1rem">
                        <label
                            style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-sub)">新しいトークン</label>
                        <div class="url-row" style="margin-top:.4rem">
                            <input class="input" id="new-token-input" type="text" readonly onclick="this.select()">
                            <button class="copy-btn" id="copy-token-btn">コピー</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/particles.js"></script>
    <script type="module">
        import { auth } from '/js/core/auth.js';
        import { api } from '/js/core/api.js';

        if (!auth.requireAuth()) throw new Error('redirect');

        const me = auth.getUser();
        document.getElementById('nav-username').textContent = me?.username ?? '';
        if (auth.isAdmin()) document.getElementById('nav-admin-link').classList.remove('hidden');

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await api.auth.logout().catch(() => { });
            auth.clearSession();
            location.href = '/login.html';
        });

        function fmtBytes(b) {
            if (!b) return '—';
            const u = ['B', 'KB', 'MB', 'GB'];
            let i = 0;
            while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
            return b.toFixed(i ? 1 : 0) + ' ' + u[i];
        }

        function showMsg(text, ok) {
            const el = document.getElementById('msg');
            el.textContent = text;
            el.className = ok ? 'ok' : 'err';
        }

        try {
            const user = await api.auth.me();
            document.getElementById('info-username').textContent = user.username ?? '—';
            document.getElementById('info-role').textContent = user.role ?? '—';
            const files = await api.files.list({ limit: 100 });
            const used = (files?.items ?? []).reduce((sum, file) => sum + (file.size ?? 0), 0);
            const limit = user.storage_limit_bytes;
            document.getElementById('info-storage').textContent = limit
                ? `${fmtBytes(used)} / ${fmtBytes(limit)}`
                : `${fmtBytes(used)} (無制限)`;
        } catch { }

        document.getElementById('rotate-btn').addEventListener('click', async () => {
            if (!confirm('ログイントークンを再生成しますか？現在のトークンは無効になります。')) return;
            try {
                const res = await api.auth.rotateToken();
                const token = res.token ?? res.login_token ?? res.loginToken;
                document.getElementById('new-token-input').value = token ?? '—';
                document.getElementById('new-token-wrap').style.display = '';
                showMsg('トークンを再生成しました', true);
            } catch {
                showMsg('再生成に失敗しました', false);
            }
        });

        document.getElementById('copy-token-btn').addEventListener('click', () => {
            const val = document.getElementById('new-token-input').value;
            navigator.clipboard.writeText(val).catch(() => { });
            const btn = document.getElementById('copy-token-btn');
            btn.textContent = 'コピー済み';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('copied'); }, 2000);
        });

        document.getElementById('logout-all-btn').addEventListener('click', async () => {
            if (!confirm('全セッションをログアウトしますか？')) return;
            try {
                await api.auth.logoutAll();
                auth.clearSession();
                location.href = '/login.html';
            } catch {
                showMsg('ログアウトに失敗しました', false);
            }
        });

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => { });
    </script>
</body>

</html>
