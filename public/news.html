    <!-- Page Banner + Main -->
    <main>
        <div class="news-banner">
            <div class="news-banner-inner reveal">

                    <a href="/">ホーム</a>

                <h1>お知らせ <span class="news-banner-hl">&amp; Updates</span></h1>
                <p class="news-banner-sub">最新のお知らせ・アップデート・ガイドなどをまとめています。</p>
            </div>
        </div>

        <div class="news-wrap">
            <!-- Search & Filter -->
            <div class="news-toolbar reveal">
                <div class="news-search-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"

                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input id="searchInput" type="text" placeholder="記事を検索..." autocomplete="off">
                </div>
                <div class="news-filter-bar" id="filterBar">
                    <button class="news-filter-btn active" data-filter="all">All</button>
                    <button class="news-filter-btn" data-filter="News">News</button>
                    <button class="news-filter-btn" data-filter="Update">Update</button>
                    <button class="news-filter-btn" data-filter="Guide">Guide</button>
                    <button class="news-filter-btn" data-filter="Note">Note</button>
                    <button class="news-filter-btn" data-filter="Danger">Danger</button>
                </div>
            </div>

            <p class="news-count" id="newsCount"></p>

            <div class="news-grid" id="newsGrid"></div>

            <div class="news-empty" id="newsEmpty">
                <div class="news-empty-icon">

                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <!-- 虫眼鏡のレンズ部分 -->
                        <circle cx="11" cy="11" r="8"></circle>
                        <!-- 虫眼鏡の持ち手部分 -->
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>

            </div>

    <script src="/js/particles.js"></script>
    <script type="module" src="/js/nav.js"></script>
    <script type="module">
        import { auth } from '/js/core/auth.js';

        if (window.__vaNewsInit) throw new Error('already initialized');
        window.__vaNewsInit = true;
        document.addEventListener('va:navigate-away', () => { window.__vaNewsInit = false; });

        if (!auth.requireAuth()) throw new Error('redirect');

        const user = auth.getUser();
        document.getElementById('nav-username').textContent = user?.username ?? '';
        document.getElementById('drawerUsername').textContent = user?.username ?? '';
        if (auth.isAdmin()) document.getElementById('drawer-admin').classList.remove('hidden');

        const TYPE_CLASS = {
            Update: 'nb-update',
            News: 'nb-news',
            Guide: 'nb-guide',
            Note: 'nb-note',
            Danger: 'nb-danger',
        };

        let allArticles = [];
        let readUrls = new Set();
        let currentFilter = 'all';
        let currentSearch = '';

        function buildCard(art) {
            const a = document.createElement('a');
            a.href = `/news/article.html?slug=${encodeURIComponent(art.slug)}`;
            a.className = 'news-card';
            const typeDisplay = art.type ? art.type.charAt(0).toUpperCase() + art.type.slice(1) : 'News';
            a.dataset.type = typeDisplay;

            if (art.image) {
                const bg = document.createElement('div');
                bg.className = 'news-card-bg';
                bg.style.backgroundImage = `url('${art.image}')`;
                a.appendChild(bg);
                a.classList.add('has-bg');
            }

            const badgeClass = TYPE_CLASS[typeDisplay] || 'nb-news';
            const tagsHtml = (art.tags || '')
                .split(',').map(t => t.trim()).filter(Boolean)
                .map(t => `<span class="news-tag">${t}</span>`).join('');

            const isUnread = !readUrls.has(art.slug);
            const unreadBadge = isUnread ? '<span class="news-unread-dot" title="未読"></span>' : '';

            const body = document.createElement('div');
            body.className = 'news-card-body';
            body.innerHTML = `
                <div class="news-card-meta">
                    <span class="news-badge ${badgeClass}">${typeDisplay}</span>
                    ${unreadBadge}
                    <span class="news-card-date">${art.date || ''}</span>
                </div>
                <div class="news-card-title">${art.title || 'Untitled'}</div>
                <p class="news-card-desc">${art.subtitle || ''}</p>
                <div class="news-card-tags">${tagsHtml}</div>
                <span class="news-card-arrow">詳細を見る →</span>`;
            a.appendChild(body);
            return a;
        }

        let cardObserver;

        function render() {
            const grid = document.getElementById('newsGrid');
            const empty = document.getElementById('newsEmpty');
            const count = document.getElementById('newsCount');
            grid.innerHTML = '';

            const q = currentSearch.toLowerCase();
            const filtered = allArticles.filter(art => {
                const typeDisplay = art.type ? art.type.charAt(0).toUpperCase() + art.type.slice(1) : 'News';
                const matchType = currentFilter === 'all' || typeDisplay === currentFilter;
                const matchSearch = !q
                    || (art.title || '').toLowerCase().includes(q)
                    || (art.subtitle || '').toLowerCase().includes(q)
                    || (art.tags || '').toLowerCase().includes(q);
                return matchType && matchSearch;
            });

            if (filtered.length === 0) {
                empty.style.display = 'block';
                count.innerHTML = '';
            } else {
                empty.style.display = 'none';
                count.innerHTML = `<strong>${filtered.length}</strong> 件の記事`;
                filtered.forEach(art => grid.appendChild(buildCard(art)));
            }

            if (cardObserver) cardObserver.disconnect();
            const cards = grid.querySelectorAll('.news-card');
            if (cards.length) {
                cardObserver = new IntersectionObserver(entries => {
                    entries.forEach(e => {
                        if (e.isIntersecting) {
                            e.target.classList.add('visible');
                            cardObserver.unobserve(e.target);
                        }
                    });
                }, { threshold: 0.1 });
                cards.forEach((el, i) => {
                    el.classList.add('reveal');
                    const d = (i % 5) + 1;
                    if (d <= 4) el.classList.add(`reveal-d${d}`);
                    cardObserver.observe(el);
                });
            }
        }

        document.getElementById('filterBar').addEventListener('click', e => {
            const btn = e.target.closest('.news-filter-btn');
            if (!btn) return;
            document.querySelectorAll('.news-filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            render();
        });

        let searchTimer;
        document.getElementById('searchInput').addEventListener('input', e => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => { currentSearch = e.target.value; render(); }, 300);
        });

        (async () => {
            try {
                const token = auth.getToken();
                const headers = { 'Authorization': `Bearer ${token}` };

                const [articlesRes, readRes] = await Promise.all([
                    fetch('/api/news/articles', { headers }),
                    fetch('/api/news/read-urls', { headers }),
                ]);

                if (!articlesRes.ok) throw new Error(`HTTP ${articlesRes.status}`);
                allArticles = await articlesRes.json();
                allArticles.sort((a, b) => new Date(b.date) - new Date(a.date));

                if (readRes.ok) {
                    const readData = await readRes.json();
                    readUrls = new Set(readData.read_urls || []);
                }

                render();
            } catch (e) {
                document.getElementById('newsGrid').innerHTML =
                    `<p style="color:var(--text-sub);padding:2rem 0">記事の読み込みに失敗しました。</p>`;

            }
        })();
    </script>
    <script src="/js/dev-reload.js?v=1" defer></script>
