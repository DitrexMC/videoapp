<!DOCTYPE html>
<html lang="ja" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>videoapp — ファイル詳細</title>
    <link rel="icon" href="/icons/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">
    <script src="/js/nav-theme.js"></script>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/app.css">
    <style>
        .file-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media(max-width:600px) {
            .file-detail-grid {
                grid-template-columns: 1fr;
            }
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: .55rem 0;
            border-bottom: 1px solid var(--border);
        }

        .meta-row:last-child {
            border-bottom: none;
        }

        .meta-key {
            color: var(--text-sub);
            font-size: .78rem;
            text-transform: uppercase;
            letter-spacing: .5px;
            font-weight: 700;
        }

        .meta-val {
            font-size: .88rem;
            font-weight: 600;
        }

        .preview-area {
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            background: var(--bg3);
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-area img,
        .preview-area video,
        .preview-area audio {
            max-width: 100%;
            max-height: 400px;
            display: block;
            margin: auto;
        }

        .preview-no {
            color: var(--text-sub);
            font-size: .85rem;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <div class="page-glow page-glow-1"></div>
    <div class="page-glow page-glow-2"></div>

    <nav id="nav">
        <a class="nav-logo" href="/">videoapp</a>
        <ul class="nav-links">
            <li><a href="/">ホーム</a></li>
            <li><a href="/upload.html">アップロード</a></li>
            <li><a href="/files.html">マイファイル</a></li>
            <li><a href="/settings.html">設定</a></li>
            <li id="nav-admin-link" class="hidden"><a href="/admin.html">管理</a></li>
        </ul>
        <div class="nav-user">
            <span id="nav-username"></span>
            <button class="theme-toggle" id="theme-toggle"></button>
            <button class="btn btn-ghost btn-sm" id="logout-btn">ログアウト</button>
        </div>
    </nav>

    <main>
        <div class="container">
            <div style="margin-bottom:1rem">
                <a href="/files.html" class="btn btn-ghost btn-sm">← マイファイルへ戻る</a>
            </div>

            <div id="page-content">
                <div class="card">読み込み中...</div>
            </div>
        </div>
    </main>

    <script src="/js/particles.js"></script>
    <script type="module">
        import { auth } from '/js/core/auth.js';
        import { api } from '/js/core/api.js';

        if (!auth.requireAuth()) throw new Error('redirect');

        const me = auth.getUser();
        document.getElementById('nav-username').textContent = me?.username ?? '';
        if (auth.isAdmin()) document.getElementById('nav-admin-link').classList.remove('hidden');

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await api.auth.logout().catch(() => { });
            auth.clearSession();
            location.href = '/login.html';
        });

        function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

        function fmtBytes(b) {
            if (!b) return '0 B';
            const u = ['B', 'KB', 'MB', 'GB'];
            let i = 0;
            while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
            return b.toFixed(i ? 1 : 0) + ' ' + u[i];
        }

        function fmtDate(iso) {
            if (!iso) return '—';
            return new Date(typeof iso === 'number' ? iso * 1000 : iso)
                .toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function renderPreview(f) {
            if (!f.mime_type) return '';
            const src = `/files/${f.id}/download`;
            if (f.mime_type.startsWith('image/')) return `<img src="${esc(src)}" alt="${esc(f.safe_name)}">`;
            if (f.mime_type.startsWith('video/')) return `<video src="${esc(src)}" controls></video>`;
            if (f.mime_type.startsWith('audio/')) return `<audio src="${esc(src)}" controls></audio>`;
            return '<div class="preview-no">プレビュー非対応</div>';
        }

        const id = new URLSearchParams(location.search).get('id');
        if (!id) { location.href = '/files.html'; throw new Error('no id'); }

        const dl = `${location.origin}/files/${id}/download`;

        try {
            const f = await api.files.get(id);
            document.title = `videoapp — ${f.safe_name}`;

            document.getElementById('page-content').innerHTML = `
                <div class="stat-tag reveal"><span class="stat-tag-dot"></span>File Detail</div>
                <div class="sec-eye reveal reveal-d1">
                    <div class="sec-eye-text">
                        <div class="sec-lbl">File</div>
                        <h1>${esc(f.safe_name)}</h1>
                    </div>
                </div>

                <div class="file-detail-grid mt-2">
                    <div class="card reveal reveal-d2">
                        <div class="meta-row"><span class="meta-key">ファイル名</span><span class="meta-val">${esc(f.safe_name)}</span></div>
                        <div class="meta-row"><span class="meta-key">サイズ</span><span class="meta-val">${fmtBytes(f.size)}</span></div>
                        <div class="meta-row"><span class="meta-key">MIMEタイプ</span><span class="meta-val">${esc(f.mime_type)}</span></div>
                        <div class="meta-row"><span class="meta-key">状態</span><span class="meta-val">${esc(f.status)}</span></div>
                        <div class="meta-row"><span class="meta-key">公開設定</span><span class="meta-val">${f.public ? '<span class="badge badge-blue">公開</span>' : '<span class="badge badge-gray">非公開</span>'}</span></div>
                        <div class="meta-row"><span class="meta-key">アップロード日</span><span class="meta-val">${fmtDate(f.created_at)}</span></div>
                        <div class="meta-row"><span class="meta-key">有効期限</span><span class="meta-val">${fmtDate(f.expires_at)}</span></div>
                        <div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap">
                            ${f.status === 'ready' ? `<a class="btn btn-primary btn-sm" href="${esc(dl)}" download="${esc(f.safe_name)}">ダウンロード</a>` : ''}
                            <button class="btn btn-ghost btn-sm" id="toggle-pub-btn">${f.public ? '非公開にする' : '公開にする'}</button>
                            <button class="btn btn-danger btn-sm" id="delete-btn">削除</button>
                        </div>
                    </div>

                    <div class="card reveal reveal-d3">
                        <div style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-sub);margin-bottom:.8rem">プレビュー</div>
                        <div class="preview-area">${renderPreview(f)}</div>
                        <div style="margin-top:1rem">
                            <label style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-sub)">ダウンロードリンク</label>
                            <div class="url-row" style="margin-top:.4rem">
                                <input class="input" type="text" id="dl-url" value="${esc(dl)}" readonly onclick="this.select()">
                                <button class="copy-btn" id="copy-btn">コピー</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            const isPublicRef = { v: !!f.public };
            document.getElementById('copy-btn').addEventListener('click', () => {
                navigator.clipboard.writeText(dl).catch(() => { });
                const btn = document.getElementById('copy-btn');
                btn.textContent = 'コピー済み';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('copied'); }, 2000);
            });

            document.getElementById('toggle-pub-btn').addEventListener('click', async () => {
                const btn = document.getElementById('toggle-pub-btn');
                btn.disabled = true;
                try {
                    await api.files.setPublic(id, !isPublicRef.v);
                    isPublicRef.v = !isPublicRef.v;
                    btn.textContent = isPublicRef.v ? '非公開にする' : '公開にする';
                } finally { btn.disabled = false; }
            });

            document.getElementById('delete-btn').addEventListener('click', async () => {
                if (!confirm(`「${f.safe_name}」を削除しますか？`)) return;
                await api.files.delete(id);
                location.href = '/files.html';
            });

        } catch {
            document.getElementById('page-content').innerHTML = '<div class="card">ファイルの読み込みに失敗しました</div>';
        }

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => { });
    </script>
</body>

</html>
