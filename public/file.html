    <script>
        (function () {
            'use strict';

            /* ── Helpers ── */
            function esc(s) {
                return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }
            function fmtBytes(b) {
                if (!b && b !== 0) return '0 B';
                if (b >= 1073741824) return (b / 1073741824).toFixed(2) + ' GB';
                if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
                if (b >= 1024) return (b / 1024).toFixed(0) + ' KB';
                return b + ' B';
            }
            function fmtDate(ts) {
                if (!ts) return '—';
                var d = new Date(ts);
                return d.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' })
                    + ' ' + d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
            }
            function getExt(name) {
                if (!name) return '';
                var idx = name.lastIndexOf('.');
                return idx >= 0 ? name.slice(idx + 1).toLowerCase() : '';
            }
            function getCategory(mime, name) {
                if (mime.startsWith('video/')) return 'video';
                if (mime.startsWith('image/')) return 'image';
                if (mime.startsWith('audio/')) return 'audio';
                if (mime === 'application/pdf') return 'pdf';
                if (mime.startsWith('font/') || /font-/.test(mime)) return 'font';
                var ext = getExt(name);
                var textExts = new Set(['txt', 'md', 'markdown', 'json', 'xml', 'yaml', 'yml', 'toml', 'ini', 'cfg', 'conf', 'js', 'mjs', 'cjs', 'ts', 'jsx', 'tsx', 'css', 'scss', 'sass', 'less', 'html', 'htm', 'xhtml', 'php', 'py', 'rb', 'go', 'rs', 'java', 'kt', 'c', 'cpp', 'h', 'hpp', 'cs', 'sh', 'bash', 'zsh', 'fish', 'ps1', 'lua', 'sql', 'gql', 'graphql', 'vue', 'svelte', 'astro', 'env', 'gitignore', 'dockerfile', 'makefile', 'log', 'patch', 'diff', 'tex', 'r', 'scala', 'swift', 'dart']);
                if (textExts.has(ext)) return 'text';
                if (mime.startsWith('text/')) return 'text';
                if (mime === 'application/json' || mime === 'application/xml' || mime === 'application/javascript' || mime === 'image/svg+xml') return 'text';
                return 'binary';
            }
            function getHljsLang(mime, name) {
                var ext = getExt(name);
                var m = { js: 'javascript', mjs: 'javascript', cjs: 'javascript', ts: 'typescript', jsx: 'javascript', tsx: 'typescript', css: 'css', scss: 'scss', less: 'less', html: 'html', htm: 'html', xhtml: 'xml', xml: 'xml', svg: 'xml', json: 'json', yaml: 'yaml', yml: 'yaml', toml: 'toml', py: 'python', rb: 'ruby', go: 'go', rs: 'rust', java: 'java', kt: 'kotlin', c: 'c', cpp: 'cpp', h: 'c', hpp: 'cpp', cs: 'csharp', sh: 'bash', bash: 'bash', zsh: 'bash', ps1: 'powershell', lua: 'lua', sql: 'sql', gql: 'graphql', graphql: 'graphql', php: 'php', swift: 'swift', dart: 'dart', r: 'r', scala: 'scala', md: 'markdown', markdown: 'markdown' };
                if (m[ext]) return m[ext];
                if (mime === 'application/json') return 'json';
                if (mime === 'application/xml' || mime === 'image/svg+xml') return 'xml';
                if (mime === 'application/javascript') return 'javascript';
                return 'plaintext';
            }
            var BINARY_ICONS = {
                archive: '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>',
                document: '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
                exe: '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>',
                database: '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>',
                '3d': '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
                cert: '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
                file: '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'
            };
            function getBinaryMeta(mime, name) {
                var ext = getExt(name);
                if (['zip', 'tar', 'gz', 'bz2', 'xz', '7z', 'rar', 'tgz'].includes(ext)) return { label: 'Archive', color: '#f59e0b', icon: 'archive' };
                if (['doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'odt', 'ods'].includes(ext)) return { label: 'Document', color: '#3b82f6', icon: 'document' };
                if (['exe', 'dmg', 'pkg', 'deb', 'rpm', 'msi', 'apk'].includes(ext)) return { label: 'Executable', color: '#ef4444', icon: 'exe' };
                if (['db', 'sqlite', 'sqlite3', 'mdb'].includes(ext)) return { label: 'Database', color: '#8b5cf6', icon: 'database' };
                if (['obj', 'fbx', 'stl', 'glb', 'gltf', 'blend'].includes(ext)) return { label: '3D Model', color: '#10b981', icon: '3d' };
                if (['pem', 'crt', 'cer', 'p12', 'pfx'].includes(ext)) return { label: 'Certificate', color: '#f472b6', icon: 'cert' };
                return { label: ext ? ext.toUpperCase() : 'Binary', color: '#94a3b8', icon: 'file' };
            }

            /* ── Auth helpers ── */
            function getStoredToken() {
                try {
                    var raw = sessionStorage.getItem('va_session') || localStorage.getItem('va_session');
                    if (!raw) return null;
                    return JSON.parse(raw).token || null;
                } catch (e) { return null; }
            }

            function clearStoredSession() {
                sessionStorage.removeItem('va_session');
                sessionStorage.removeItem('va_user');
                localStorage.removeItem('va_session');
                localStorage.removeItem('va_user');
            }

            function apiFetch(method, path, body) {
                var headers = {};
                var token = getStoredToken();
                if (token) headers['Authorization'] = 'Bearer ' + token;
                if (body !== undefined) headers['Content-Type'] = 'application/json';
                return fetch(path, {
                    method: method,
                    headers: headers,
                    cache: method === 'GET' ? 'no-store' : 'default',
                    body: body !== undefined ? JSON.stringify(body) : undefined
                });
            }

            async function fetchFileDetail(token) {
                var anonymousResponse = await fetch('/files/' + fileId, {
                    cache: 'no-store'
                });
                if (anonymousResponse.ok) {
                    return anonymousResponse;
                }
                if (anonymousResponse.status === 404) {
                    throw new Error('not_found');
                }
                if ((anonymousResponse.status !== 401 && anonymousResponse.status !== 403) || !token) {
                    throw new Error(
                        anonymousResponse.status === 401 || anonymousResponse.status === 403
                            ? 'forbidden'
                            : 'fetch_error'
                    );
                }

                var authedResponse = await fetch('/files/' + fileId, {
                    headers: { 'Authorization': 'Bearer ' + token },
                    cache: 'no-store'
                });
                if (authedResponse.ok) {
                    return authedResponse;
                }
                if (authedResponse.status === 404) {
                    throw new Error('not_found');
                }
                throw new Error(authedResponse.status === 403 ? 'forbidden' : 'fetch_error');
            }

            /* ── Page init ── */
            var fileId = new URLSearchParams(location.search).get('id');
            if (!fileId) { location.href = '/files.html'; throw new Error('no id'); }

            var currentFile = null;
            var currentMe = null;

            async function init() {
                /* Optional auth: only call /auth/me if a token is present */
                var token = getStoredToken();
                var validatedToken = null;
                if (token) {
                    try {
                        var r = await fetch('/auth/me', { headers: { 'Authorization': 'Bearer ' + token }, cache: 'no-store' });
                        if (r.ok) {
                            var data = await r.json();
                            currentMe = data.user || data;
                            validatedToken = token;
                        } else if (r.status === 401) {
                            clearStoredSession();
                        }
                    } catch (e) { /* ignore */ }
                }

                /* Fetch file — first anonymously, then retry with auth only if needed */
                try {
                    var fr = await fetchFileDetail(validatedToken);
                    currentFile = await fr.json();
                } catch (e) {
                    if (e.message === 'forbidden') {
                        showPrivateError();
                        return;
                    }
                    showError(e.message === 'not_found' ? 'ファイルが見つかりませんでした' : 'ファイルの読み込みに失敗しました');
                    return;
                }

                var f = currentFile;
                document.title = (f.safe_name || f.original_name || 'ファイル') + ' — VideoApp';

                var ownerId = String(f.owner_user_id || '');
                document.getElementById('owner-data').dataset.ownerId = ownerId;

                var canManage = currentMe && (String(currentMe.id) === ownerId || currentMe.role === 'admin');

                var mime = f.mime_type || '';
                var name = f.safe_name || f.original_name || '';
                var category = getCategory(mime, name);

                document.body.className = 'preview-' + category;

                setOgMeta(f);
                buildInfoPanel(f, mime, name, canManage);

                if (canManage) {
                    document.getElementById('owner-panel').hidden = false;
                    bindOwnerEvents(f);
                }

                if (f.status !== 'ready') {
                    showFileStatusState(f);
                    return;
                }

                buildPreview(f, category, mime, name);
            }

            function showError(msg) {
                document.getElementById('preview-area').outerHTML = '<div class="binary-wrap" id="preview-area"><div class="binary-glow"></div><div class="binary-icon-box">⚠️</div><div class="binary-label">エラー</div><div class="binary-sub">' + esc(msg) + '</div></div>';
            }

            function showPrivateError() {
                document.title = '非公開ファイル — VideoApp';
                document.body.className = 'preview-binary';
                document.getElementById('viewer').innerHTML = '<div class="binary-wrap" id="preview-area"><div class="binary-glow" style="background:radial-gradient(ellipse,rgba(245,158,11,.14) 0%,transparent 70%)"></div><div class="binary-icon-box" style="background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.24);color:var(--yellow)"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div><div class="binary-label" style="color:var(--yellow)">このファイルはプライベートです。</div><div class="binary-sub">所有者のみ閲覧できます。</div></div>';
            }

            function showFileStatusState(f) {
                var statusMap = {
                    uploading: {
                        accent: 'var(--accent3)',
                        chip: 'アップロード中',
                        icon: '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
                        title: 'このファイルはアップロード中です',
                        desc: 'アップロード完了後にプレビューと再生が利用できます。'
                    },
                    processing: {
                        accent: 'var(--accent2)',
                        chip: '処理中',
                        icon: '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',

                if (category === 'pdf') {
                    area.outerHTML = '<div class="pdf-wrap-outer" id="preview-area">'

                if (category === 'text') {

            /* ── Info panel ── */
            function buildInfoPanel(f, mime, name, canManage) {
                var ext = getExt(name);

                var ownerUsername = '';

                document.getElementById('meta-chips').innerHTML =

            /* ── Copy buttons ── */
            function copyText(text, btn) {
                var origHtml = btn.getAttribute('data-orig-html') || btn.innerHTML;
                function onSuccess() {
                    btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> \u30b3\u30d4\u30fc\u6e08\u307f';
                    btn.classList.add('copied');
                    setTimeout(function () { btn.innerHTML = origHtml; btn.classList.remove('copied'); }, 2000);
                }
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text).then(onSuccess).catch(function () { fbCopy(text, onSuccess); });
                } else {
                    fbCopy(text, onSuccess);
                }
            }
            function fbCopy(text, cb) {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.cssText = 'position:fixed;top:-999px;left:-999px;opacity:0;';
                document.body.appendChild(ta);
                ta.focus(); ta.select();
                try { document.execCommand('copy'); cb(); } catch (e) { }
                document.body.removeChild(ta);
            }
            function bindCopyButtons() {
                document.querySelectorAll('.copy-btn').forEach(function (btn) {
                    if (btn.dataset.copyBound) return;
                    btn.dataset.copyBound = '1';
                    btn.setAttribute('data-orig-html', btn.innerHTML);
                    btn.addEventListener('click', function () {
                        var url = btn.dataset.url || '';
                        if (!url) return;
                        if (url.startsWith('/')) url = location.origin + url;
                        copyText(url, btn);
                    });
                });
            }

            /* ── Owner events ── */
            function bindOwnerEvents(f) {
                var isPublic = f.public !== false && !f.is_private;

                document.getElementById('owner-rename-btn').addEventListener('click', function () {
                    var name = document.getElementById('owner-name-input').value.trim();
                    if (!name) return;
                    this.disabled = true;
                    var self = this;
                    apiFetch('PATCH', '/files/' + fileId + '/rename', { name: name })
                        .then(function (r) { if (r.ok) location.reload(); else self.disabled = false; })
                        .catch(function () { self.disabled = false; });
                });

                document.getElementById('owner-expiry-btn').addEventListener('click', function () {
                    var val = document.getElementById('owner-expiry-input').value;
                    if (!val) return;
                    var ts = new Date(val).getTime();
                    if (isNaN(ts) || ts <= Date.now()) { alert('\u6709\u52b9\u671f\u9650\u306f\u672a\u6765\u306e\u65e5\u6642\u3092\u6307\u5b9a\u3057\u3066\u304f\u3060\u3055\u3044'); return; }
                    this.disabled = true;
                    var self = this;
                    apiFetch('PATCH', '/files/' + fileId + '/expire', { expiresAt: new Date(ts).toISOString() })
                        .then(function (r) { if (r.ok) location.reload(); else self.disabled = false; })
                        .catch(function () { self.disabled = false; });
                });

                document.getElementById('owner-expiry-clear-btn').addEventListener('click', function () {
                    this.disabled = true;
                    var self = this;
                    apiFetch('PATCH', '/files/' + fileId + '/expire', { expiresAt: null })
                        .then(function (r) { if (r.ok) location.reload(); else self.disabled = false; })
                        .catch(function () { self.disabled = false; });
                });

                document.getElementById('owner-privacy-btn').addEventListener('click', function () {
                    this.disabled = true;
                    var self = this;
                    apiFetch('PATCH', '/files/' + fileId + '/public', { public: !isPublic })
                        .then(function (r) { if (r.ok) location.reload(); else self.disabled = false; })
                        .catch(function () { self.disabled = false; });
                });

                document.getElementById('btn-toggle-uploader').addEventListener('click', function () {
                    var self = this;
                    var current = self.dataset.showUploader === '1';
                    self.disabled = true;
                    apiFetch('PATCH', '/files/' + fileId + '/show-uploader', { showUploader: !current })
                        .then(function (r) {
                            if (r.ok) {
                                self.dataset.showUploader = current ? '0' : '1';
                                self.textContent = '\u6295\u7a3f\u8005\u8868\u793a: ' + (current ? 'OFF' : 'ON');
                            }
                            self.disabled = false;
                        })
                        .catch(function () { self.disabled = false; });
                });

                document.getElementById('owner-delete-btn').addEventListener('click', function () {
                    if (!confirm('\u3053\u306e\u30d5\u30a1\u30a4\u30eb\u3092\u524a\u9664\u3057\u307e\u3059\u304b\uff1f\u3053\u306e\u64cd\u4f5c\u306f\u53d6\u308a\u6d88\u305b\u307e\u305b\u3093\u3002')) return;
                    this.disabled = true;
                    var self = this;
                    apiFetch('DELETE', '/files/' + fileId)
                        .then(function (r) { if (r.ok) location.href = '/'; else self.disabled = false; })
                        .catch(function () { self.disabled = false; });
                });
            }

            /* ── Video ── */
            function initVideo() {
                var vid = document.getElementById('vid');
                var src = document.getElementById('vid-src');
                var err = document.getElementById('media-err');
                if (!vid) return;
                function showErr() {
                    vid.style.display = 'none';
                    if (err) err.style.display = 'flex';
                }
                vid.addEventListener('error', showErr);
                if (src) src.addEventListener('error', showErr);
                vid.addEventListener('loadedmetadata', function () {
                    if (isNaN(vid.duration) || vid.duration === 0) showErr();
                });
            }

            /* ── Image ── */
            function initImage() {
                var img = document.getElementById('preview-img');
                var lb = document.getElementById('lightbox');
                var lbClose = document.getElementById('lb-close');
                var lbImg = document.getElementById('lb-img');
                var zoomBtn = document.getElementById('zoom-btn');
                var checkerBtn = document.getElementById('checker-toggle');
                var wrap = document.querySelector('.img-wrap');

                if (checkerBtn && wrap) {
                    checkerBtn.addEventListener('click', function (e) { e.stopPropagation(); wrap.classList.toggle('checker'); });
                }
                function openLb() {
                    if (lb && img && img.src) { lbImg.src = img.src; lb.classList.add('open'); }
                }
                function closeLb() { if (lb) lb.classList.remove('open'); }
                if (img) img.addEventListener('click', openLb);
                if (zoomBtn) zoomBtn.addEventListener('click', function (e) { e.stopPropagation(); openLb(); });
                if (lbClose) lbClose.addEventListener('click', closeLb);
                if (lb) lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });
                document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLb(); });
                if (wrap) {
                    wrap.addEventListener('click', function (e) {
                        if (e.target !== wrap) return;
                        if (img && img.style.display !== 'none') openLb();
                    });
                }
            }

            /* ── Audio ── */
            function initAudio() {
                var aud = document.getElementById('aud');
                var playBtn = document.getElementById('aud-play');
                var playIcon = document.getElementById('aud-play-icon');
                var seek = document.getElementById('aud-seek');
                var cur = document.getElementById('aud-cur');
                var dur = document.getElementById('aud-dur');
                var vol = document.getElementById('aud-vol');
                var rewBtn = document.getElementById('aud-rew');
                var fwdBtn = document.getElementById('aud-fwd');
                var loopBtn = document.getElementById('aud-loop');
                var restartBtn = document.getElementById('aud-restart');
                var canvas = document.getElementById('aud-spectrum');
                if (!aud || !playBtn) return;

                function setRangeFill(input, value, max) {
                    if (!input) return;
                    var min = parseFloat(input.min || '0');
                    var upper = typeof max === 'number' ? max : parseFloat(input.max || '100');
                    var current = typeof value === 'number' ? value : parseFloat(input.value || String(min));
                    var denom = upper - min;
                    var pct = denom <= 0 ? 0 : ((current - min) / denom) * 100;
                    input.style.setProperty('--range-pct', Math.max(0, Math.min(100, pct)).toFixed(3) + '%');
                }
                function fmt(s) {
                    if (!isFinite(s) || s < 0) return '\u2014';
                    var m = Math.floor(s / 60), ss = Math.floor(s % 60);
                    return m + ':' + (ss < 10 ? '0' : '') + ss;
                }
                var PLAY_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
                var PAUSE_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';

                function syncPlay() { if (playIcon) playIcon.innerHTML = aud.paused ? PLAY_ICON : PAUSE_ICON; }
                function setArtSpin(on) { var a = document.getElementById('aud-art-box'); if (a) a.classList.toggle('playing', on); }

                if (aud.readyState >= 1 && dur) dur.textContent = fmt(aud.duration);
                aud.addEventListener('loadedmetadata', function () { if (dur) dur.textContent = fmt(aud.duration); });
                aud.addEventListener('timeupdate', function () {
                    if (cur) cur.textContent = fmt(aud.currentTime);
                    if (seek && aud.duration && !seekDrag) {
                        seek.value = (aud.currentTime / aud.duration * 100);
                        setRangeFill(seek, parseFloat(seek.value), 100);
                    }
                });
                aud.addEventListener('play', function () { syncPlay(); setArtSpin(true); });
                aud.addEventListener('pause', function () { syncPlay(); setArtSpin(false); });
                aud.addEventListener('ended', function () {
                    if (seek) seek.value = 0;
                    setRangeFill(seek, 0, 100);
                    if (cur) cur.textContent = '0:00';
                    syncPlay(); setArtSpin(false);
                });
                aud.addEventListener('error', function () { if (dur) dur.textContent = '\u30a8\u30e9\u30fc'; });

                var seekDrag = false;
                if (seek) {
                    setRangeFill(seek, parseFloat(seek.value), 100);
                    seek.addEventListener('mousedown', function () { seekDrag = true; });
                    seek.addEventListener('touchstart', function () { seekDrag = true; }, { passive: true });
                    seek.addEventListener('mouseup', function () { seekDrag = false; });
                    seek.addEventListener('touchend', function () { seekDrag = false; });
                    seek.addEventListener('input', function () {
                        setRangeFill(seek, parseFloat(seek.value), 100);
                        if (aud.duration) aud.currentTime = (seek.value / 100) * aud.duration;
                    });
                    seek.addEventListener('change', function () {
                        seekDrag = false;
                        setRangeFill(seek, parseFloat(seek.value), 100);
                    });
                }
                if (rewBtn) rewBtn.addEventListener('click', function () { aud.currentTime = Math.max(0, aud.currentTime - 10); });
                if (fwdBtn) fwdBtn.addEventListener('click', function () { if (aud.duration) aud.currentTime = Math.min(aud.duration, aud.currentTime + 10); });
                if (restartBtn) restartBtn.addEventListener('click', function () { aud.currentTime = 0; if (aud.paused) aud.play(); });
                if (vol) {
                    setRangeFill(vol, parseFloat(vol.value), 1);
                    vol.addEventListener('input', function () { aud.volume = parseFloat(vol.value); setRangeFill(vol, parseFloat(vol.value), 1); });
                }
                if (loopBtn) {
                    loopBtn.addEventListener('click', function () { aud.loop = !aud.loop; loopBtn.classList.toggle('active', aud.loop); });
                }
                if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                    var volRow = document.getElementById('aud-vol-row');
                    var volIos = document.getElementById('aud-vol-ios');
                    if (volRow) volRow.style.display = 'flex';
                    if (volIos) volIos.style.display = '';
                }

                /* Metadata */
                apiFetch('GET', '/files/' + fileId + '/meta')
                    .then(function (r) { return r.ok ? r.json() : {}; })
                    .then(function (meta) {
                        if (!meta || (!meta.title && !meta.artist && !meta.album)) return;
                        var titleEl = document.getElementById('aud-title');
                        var metaEl = document.getElementById('aud-meta');
                        var artImg = document.getElementById('aud-art-img');
                        var artIcon = document.getElementById('aud-art-icon');
                        if (meta.title && titleEl) { titleEl.textContent = meta.title; titleEl.title = meta.title; }
                        var parts = [];
                        if (meta.artist) parts.push(meta.artist);
                        if (meta.album) parts.push(meta.album);
                        if (meta.year) parts.push(String(meta.year));
                        if (parts.length > 0 && metaEl) { metaEl.hidden = false; metaEl.textContent = parts.join(' \u00B7 '); }
                        if (meta.coverArt && artImg && artIcon) {
                            artImg.src = meta.coverArt; artImg.style.display = ''; artIcon.style.display = 'none';
                        }
                    }).catch(function () { });

                /* Spectrum */
                var audioCtx = null, analyser = null, srcNode = null, rafId = null, freqData = null, sqrtPrev = null;

                function cleanupSpectrum() {
                    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
                    if (srcNode) { try { srcNode.disconnect(); } catch (e) { } srcNode = null; }
                    if (audioCtx && audioCtx.state !== 'closed') { try { audioCtx.close(); } catch (e) { } }
                    audioCtx = null; analyser = null; freqData = null; sqrtPrev = null;
                }

                function initSpectrum() {
                    if (!canvas || audioCtx) return !!audioCtx;
                    try {
                        var ctx = new (window.AudioContext || window.webkitAudioContext)();
                        var anl = ctx.createAnalyser();
                        anl.fftSize = 2048;
                        anl.smoothingTimeConstant = 0.5;
                        audioCtx = ctx; analyser = anl;
                        var s = ctx.createMediaElementSource(aud);
                        s.connect(anl); anl.connect(ctx.destination); srcNode = s;
                        var binCount = anl.frequencyBinCount;
                        freqData = new Uint8Array(binCount);
                        sqrtPrev = new Float32Array(256);
                        var cctx = canvas.getContext('2d');

                        function draw() {
                            rafId = requestAnimationFrame(draw);
                            if (!audioCtx || !canvas || canvas.offsetWidth === 0) return;
                            var cw = canvas.width = canvas.offsetWidth;
                            var ch = canvas.height = canvas.offsetHeight;
                            anl.getByteFrequencyData(freqData);
                            cctx.clearRect(0, 0, cw, ch);

                            var BARS = Math.max(48, Math.min(192, Math.floor(cw / 4)));
                            var gap = 0.6;
                            var barW = Math.max(1.5, (cw - (BARS - 1) * gap) / BARS);
                            var totalW = BARS * barW + (BARS - 1) * gap;
                            var cx = Math.max(0, (cw - totalW) / 2);
                            var startBin = 2, endBin = binCount - 1, binRange = endBin - startBin;

                            for (var i = 0; i < BARS; i++) {
                                var t = i / Math.max(1, BARS - 1);
                                var logIdx = startBin + Math.round(Math.pow(t, 1.9) * binRange);
                                var val = freqData[Math.min(logIdx, binCount - 1)];
                                var prev = sqrtPrev[i] || val;
                                var smooth = prev * 0.5 + val * 0.5;
                                sqrtPrev[i] = smooth;
                                var bh = Math.max(1, (smooth / 255) * ch * 0.88);
                                var x = cx + i * (barW + gap);
                                var y = ch - bh;
                                var isDark = document.documentElement.getAttribute('data-theme') !== 'light';
                                var grad = cctx.createLinearGradient(0, y, 0, ch);
                                if (isDark) {
                                    grad.addColorStop(0, 'rgba(99,102,241,.95)');
                                    grad.addColorStop(0.35, 'rgba(59,130,246,.75)');
                                    grad.addColorStop(0.7, 'rgba(139,92,246,.4)');
                                    grad.addColorStop(1, 'rgba(139,92,246,.15)');
                                } else {
                                    grad.addColorStop(0, 'rgba(79,70,229,.85)');
                                    grad.addColorStop(0.35, 'rgba(37,99,235,.75)');
                                    grad.addColorStop(0.7, 'rgba(109,40,217,.5)');
                                    grad.addColorStop(1, 'rgba(109,40,217,.15)');
                                }
                                cctx.fillStyle = grad;
                                var radius = Math.min(barW / 2, 2.5);
                                cctx.beginPath();
                                cctx.moveTo(x, ch);
                                cctx.lineTo(x, y + radius);
                                cctx.quadraticCurveTo(x, y, x + radius, y);
                                cctx.lineTo(x + barW - radius, y);
                                cctx.quadraticCurveTo(x + barW, y, x + barW, y + radius);
                                cctx.lineTo(x + barW, ch);
                                cctx.closePath();
                                cctx.fill();
                            }
                            if (!seekDrag && aud.duration && seek) {
                                seek.value = (aud.currentTime / aud.duration * 100);
                                setRangeFill(seek, parseFloat(seek.value), 100);
                            }
                        }
                        requestAnimationFrame(draw);
                        return true;
                    } catch (e) { cleanupSpectrum(); return false; }
                }

                playBtn.addEventListener('click', function () {
                    function doToggle() {
                        if (aud.paused) {
                            var p = aud.play();
                            if (p && p.catch) p.catch(function () { });
                        } else { aud.pause(); }
                    }
                    if (!audioCtx) {
                        var ok = initSpectrum();
                        if (!ok) { doToggle(); return; }
                    }
                    if (audioCtx && audioCtx.state === 'suspended') {
                        audioCtx.resume().then(doToggle).catch(doToggle);
                    } else { doToggle(); }
                });
            }

            /* ── Text / Code ── */
            function initText(rawUrl, hljsLang, isMarkdown) {
                var MAX_BYTES = 512 * 1024;
                var rawText = '';
                var mdMode = false;

                function renderCode(text) {
                    var container = document.getElementById('code-container');
                    var nums = text.split('\n').map(function (_, i) { return i + 1; }).join('\n');
                    var highlighted;
                    try {
                        if (window.hljs && hljsLang !== 'plaintext' && typeof hljs.highlight === 'function') {
                            highlighted = hljs.highlight(text, { language: hljsLang, ignoreIllegals: true }).value;
                        } else {
                            highlighted = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        }
                    } catch (e) {
                        highlighted = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    }
                    container.innerHTML = '<div class="ln-wrap"><pre class="ln-nums">' + nums.replace(/&/g, '&amp;') + '</pre><div class="ln-code"><pre class="hljs-pre"><code class="hljs">' + highlighted + '</code></pre></div></div>';
                }
                function renderMd(text) {
                    var md = document.getElementById('md-container');
                    if (window.marked && md && typeof marked.parse === 'function') {
                        md.innerHTML = '<div class="markdown-body">' + marked.parse(text) + '</div>';
                    }
                }

                fetch(rawUrl).then(function (r) {
                    var reader = r.body.getReader();
                    var chunks = [], total = 0, truncated = false;
                    function read() {
                        return reader.read().then(function (d) {
                            if (d.done || truncated) {
                                return new Blob(chunks).text().then(function (txt) {
                                    rawText = txt;
                                    if (truncated) { var w = document.getElementById('code-truncated-warn'); if (w) w.style.display = 'flex'; }
                                    renderCode(txt);
                                    if (isMarkdown) renderMd(txt);
                                });
                            }
                            chunks.push(d.value); total += d.value.length;
                            if (total >= MAX_BYTES) { truncated = true; reader.cancel(); }
                            return read();
                        });
                    }
                    return read();
                }).catch(function () {
                    var c = document.getElementById('code-container');
                    if (c) c.innerHTML = '<div class="code-error">\u30d5\u30a1\u30a4\u30eb\u306e\u8aad\u307f\u8fbc\u307f\u306b\u5931\u6557\u3057\u307e\u3057\u305f</div>';
                });

                var copyBtn = document.getElementById('code-copy-btn');
                if (copyBtn) {
                    copyBtn.addEventListener('click', function () {
                        if (!rawText) return;
                        copyText(rawText, copyBtn);
                    });
                }
                var mdToggle = document.getElementById('md-toggle');
                if (mdToggle && isMarkdown) {
                    mdToggle.addEventListener('click', function () {
                        mdMode = !mdMode;
                        var cc = document.getElementById('code-container');
                        var mc = document.getElementById('md-container');
                        if (cc) cc.style.display = mdMode ? 'none' : 'block';
                        if (mc) mc.style.display = mdMode ? 'block' : 'none';
                        mdToggle.textContent = mdMode ? '\u30bd\u30fc\u30b9\u8868\u793a' : '\u30ec\u30f3\u30c0\u30ea\u30f3\u30b0\u8868\u793a';
                        if (mdMode && rawText) renderMd(rawText);
                    });
                }
            }

            /* ── Font ── */
            function initFont() {
                var slider = document.getElementById('font-slider');
                var lbl = document.getElementById('font-size-lbl');
                var sample = document.getElementById('font-sample');
                if (slider && sample && lbl) {
                    slider.addEventListener('input', function () {
                        sample.style.fontSize = slider.value + 'px';
                        lbl.textContent = slider.value + 'px';
                    });
                }
            }

            /* ── Theme sync ── */
            function syncPreviewTheme(t) {
                var isDark = t !== 'light';
                var hlDark = document.getElementById('hljs-theme');
                var hlLight = document.getElementById('hljs-theme-light');
                if (hlDark && hlLight) { hlDark.disabled = !isDark; hlLight.disabled = isDark; }
            }
            document.addEventListener('va-themechange', function (event) {
                syncPreviewTheme(event.detail && event.detail.theme ? event.detail.theme : 'dark');
            });
            syncPreviewTheme(document.documentElement.getAttribute('data-theme') || 'dark');

            init();

        })();
    </script>
    <script src="/js/dev-reload.js?v=1" defer></script>
