<!DOCTYPE html>
<html lang="ja" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>videoapp — 管理画面</title>
    <link rel="icon" href="/icons/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">
    <script src="/js/nav-theme.js"></script>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/app.css">
    <style>
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        @media(max-width:700px) {
            .admin-stats {
                grid-template-columns: 1fr;
            }
        }

        .empty-row td {
            padding: 2rem;
            text-align: center;
            color: var(--text-sub);
        }

        .fr-cb-cell,
        .fr-cb-head {
            width: 2rem;
            text-align: center;
            vertical-align: middle;
        }

        .fr-actions {
            white-space: nowrap;
            display: flex;
            gap: .25rem;
            align-items: center;
        }

        .fr-action-cell {
            white-space: nowrap;
        }

        .table td,
        .table th {
            white-space: nowrap;
        }

        .fr-name-cell {
            max-width: 280px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fr-name-row {
            display: flex;
            align-items: center;
            gap: .15rem;
        }

        .fr-name-text {
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 240px;
            display: inline-block;
            vertical-align: middle;
        }

        #msg {
            min-height: 1.2rem;
            font-size: .82rem;
            font-weight: 700;
            margin-top: .4rem;
        }

        #msg.ok {
            color: var(--green);
        }

        #msg.err {
            color: var(--red);
        }

        .create-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: .8rem;
        }

        .admin-usage-inline {
            display: flex;
            align-items: center;
            gap: .4rem;
            white-space: nowrap;
            min-width: 0;
        }

        .admin-usage-inline .quota-text {
            font-size: .78rem;
            color: var(--text-sub);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .admin-usage-inline .file-count-text {
            font-size: .72rem;
            color: var(--text-sub);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .quota-bar-wrap {
            height: 4px;
            flex: 1 1 60px;
            min-width: 40px;
            max-width: 120px;
            background: var(--bg3);
            border-radius: 2px;
        }

        .quota-bar {
            height: 100%;
            background: var(--accent3);
            border-radius: 2px;
        }

        .admin-table {
            table-layout: fixed;
        }

        .ellipsis-cell {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ellipsis-cell strong {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .fr-user-cell {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #user-list tr> :first-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .search-row {
            display: flex;
            gap: .5rem;
            margin-bottom: 1rem;
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: .5rem .25rem 0;
        }

        .search-row .input {
            flex: 1;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <div class="page-glow page-glow-1"></div>
    <div class="page-glow page-glow-2"></div>

    <nav id="nav">
        <a class="nav-logo" href="/">videoapp</a>
        <ul class="nav-links">
            <li><a href="/">ホーム</a></li>
            <li><a href="/upload.html">アップロード</a></li>
            <li><a href="/files.html">マイファイル</a></li>
            <li><a href="/settings.html">設定</a></li>
            <li><a href="/admin.html" class="active">管理</a></li>
        </ul>
        <div class="nav-user">
            <span id="nav-username"></span>
            <button class="theme-toggle" id="theme-toggle"></button>
            <button class="btn btn-ghost btn-sm" id="logout-btn">ログアウト</button>
        </div>
    </nav>

    <main>
        <div class="container">
            <div class="stat-tag reveal">
                <span class="stat-tag-dot"></span>
                Admin Panel
            </div>

            <div class="sec-eye reveal reveal-d1">
                <div class="sec-eye-text">
                    <div class="sec-lbl">Management</div>
                    <h1>管理画面</h1>
                </div>
            </div>

            <!-- Stats bar -->
            <div class="admin-stats reveal reveal-d2">
                <div class="asc">
                    <div class="asc-icon"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg></div>
                    <div class="asc-val" id="stat-users">—</div>
                    <div class="asc-lbl">ユーザー数</div>
                </div>
                <div class="asc">
                    <div class="asc-icon"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" />
                            <polyline points="13 2 13 9 20 9" />
                        </svg></div>
                    <div class="asc-val" id="stat-files">—</div>
                    <div class="asc-lbl">総ファイル数</div>
                </div>
                <div class="asc">
                    <div class="asc-icon"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <ellipse cx="12" cy="5" rx="9" ry="3" />
                            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" />
                            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
                        </svg></div>
                    <div class="asc-val" id="stat-storage">—</div>
                    <div class="asc-lbl">総ストレージ</div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs reveal reveal-d3">
                <button class="tab-btn active" data-tab="users">ユーザー管理</button>
                <button class="tab-btn" data-tab="files">ファイル管理</button>
                <button class="tab-btn" data-tab="policies">設定</button>
            </div>

            <!-- Users tab -->
            <div class="tab-panel active" id="tab-users">
                <div class="card mb-2">
                    <div class="section-title">新規ユーザー作成</div>
                    <form id="create-user-form" style="margin-top:.6rem">
                        <div class="create-form">
                            <div class="form-group">
                                <label for="new-username">ユーザー名</label>
                                <input class="input" id="new-username" type="text" placeholder="例: alice" required>
                            </div>
                            <div class="form-group">
                                <label for="new-role">権限</label>
                                <select class="input" id="new-role">
                                    <option value="user">user</option>
                                    <option value="admin">admin</option>
                                </select>
                            </div>
                            <div class="form-group" style="justify-content:flex-end;padding-top:1.4rem">
                                <button type="submit" class="btn btn-primary">ユーザーを作成</button>
                            </div>
                        </div>
                        <div id="msg"></div>
                        <div id="new-token-area" style="display:none;margin-top:.8rem">
                            <label
                                style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-sub)">ログイントークン（一度しか表示されません）</label>
                            <div class="url-row" style="margin-top:.4rem">
                                <input class="input" id="new-token-out" type="text" readonly onclick="this.select()">
                                <button class="copy-btn" id="copy-token-btn" type="button">コピー</button>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="table-wrap">
                    <table class="table admin-table">
                        <colgroup>
                            <col style="width:auto">
                            <col style="width:6rem">
                            <col style="width:28rem">
                            <col style="width:5rem">
                            <col style="width:10rem">
                        </colgroup>
                        <thead>
                            <tr>
                                <th class="ellipsis-cell">ユーザー名</th>
                                <th>権限</th>
                                <th>クォータ / 使用量</th>
                                <th>状態</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="user-list">
                            <tr class="empty-row">
                                <td colspan="5">読み込み中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Files tab -->
            <div class="tab-panel" id="tab-files">
                <div class="search-row">
                    <input class="input" id="file-search-input" placeholder="ファイル名で検索..." type="search">
                    <button class="btn btn-primary" id="file-search-btn">検索</button>
                </div>
                <div class="table-wrap">
                    <table class="table admin-table">
                        <colgroup>
                            <col style="width:2rem">
                            <col style="width:auto">
                            <col style="width:8rem">
                            <col style="width:6rem">
                            <col style="width:8rem">
                            <col style="width:8rem">
                            <col style="width:6rem">
                        </colgroup>
                        <thead>
                            <tr>
                                <th>
                                    <label class="custom-cb"
                                        style="display:inline-flex;align-items:center;justify-content:center;padding:0;margin:0">
                                        <input type="checkbox" id="admin-select-all">
                                        <span class="custom-cb-box"></span>
                                    </label>
                                </th>
                                <th class="ellipsis-cell">ファイル名</th>
                                <th>ユーザー</th>
                                <th>サイズ</th>
                                <th>作成日</th>
                                <th>期限</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="admin-file-list">
                            <tr class="empty-row">
                                <td colspan="7">読み込み中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination" id="file-pagination">
                    <span class="text-sm text-sub" id="file-page-info">0件</span>
                    <div style="display:flex;gap:.4rem">
                        <button class="btn btn-ghost btn-sm" id="file-page-prev">← 前へ</button>
                        <button class="btn btn-ghost btn-sm" id="file-page-next">次へ →</button>
                    </div>
                </div>
            </div>

            <!-- Policies tab -->
            <div class="tab-panel" id="tab-policies" style="display:none">
                <div class="card">
                    <div class="section-title">サービスポリシー設定</div>
                    <form id="policy-form" style="margin-top:1rem;display:grid;gap:.8rem">
                        <div class="create-form">
                            <div class="form-group">
                                <label>デフォルトストレージ上限 (MB)</label>
                                <input class="input" id="pol-storage" type="number" min="0" placeholder="例: 10240">
                            </div>
                            <div class="form-group">
                                <label>最大ファイルサイズ (MB)</label>
                                <input class="input" id="pol-filesize" type="number" min="0" placeholder="例: 5120">
                            </div>
                            <div class="form-group">
                                <label>デフォルト有効期限 (日)</label>
                                <input class="input" id="pol-expiry" type="number" min="0" placeholder="0=無制限">
                            </div>
                            <div class="form-group">
                                <label>最大有効期限 (日)</label>
                                <input class="input" id="pol-max-expiry" type="number" min="0" placeholder="0=無制限">
                            </div>
                            <div class="form-group">
                                <label>セッション有効期間 (秒)</label>
                                <input class="input" id="pol-session" type="number" min="0" placeholder="例: 2592000">
                            </div>
                            <div class="form-group">
                                <label>デフォルトチャンクサイズ (MB)</label>
                                <input class="input" id="pol-chunk" type="number" min="0" placeholder="例: 10">
                            </div>
                            <div class="form-group">
                                <label>ZIP最大ファイル数</label>
                                <input class="input" id="pol-zip-count" type="number" min="0" placeholder="例: 100">
                            </div>
                            <div class="form-group">
                                <label>ZIP最大合計サイズ (MB)</label>
                                <input class="input" id="pol-zip-size" type="number" min="0" placeholder="例: 2048">
                            </div>
                        </div>
                        <div>
                            <button type="submit" class="btn btn-primary">ポリシーを保存</button>
                            <span id="pol-msg" style="margin-left:.8rem;font-size:.85rem;font-weight:700"></span>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/particles.js"></script>
    <script src="/js/file-row.js"></script>
    <script type="module">
        import { auth } from '/js/core/auth.js';
        import { api } from '/js/core/api.js';

        if (!auth.requireAuth()) throw new Error('redirect');
        if (!auth.isAdmin()) { location.href = '/'; throw new Error('not admin'); }

        const me = auth.getUser();
        document.getElementById('nav-username').textContent = me?.username ?? '';

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await api.auth.logout().catch(() => { });
            auth.clearSession();
            location.href = '/login.html';
        });

        function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

        function fmtBytes(b) {
            if (!b && b !== 0) return '—';
            if (b >= 1073741824) return (b / 1073741824).toFixed(2) + ' GB';
            if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
            if (b >= 1024) return (b / 1024).toFixed(0) + ' KB';
            return b + ' B';
        }

        function fmtDate(ts) {
            if (!ts) return '—';
            return new Date(typeof ts === 'number' ? ts * 1000 : ts).toLocaleDateString('ja-JP');
        }

        // Tabs
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; });
                btn.classList.add('active');
                const panel = document.getElementById('tab-' + btn.dataset.tab);
                panel.classList.add('active');
                panel.style.display = '';
            });
        });

        // ── Stats ──────────────────────────────────────────────
        let allUsers = [];
        let allFiles = [];

        async function loadStats() {
            try {
                const res = await api.admin.users.list();
                allUsers = res?.items ?? [];
                document.getElementById('stat-users').textContent = allUsers.length;
                const totalStorage = allUsers.reduce((acc, u) => acc + (u.storageUsedBytes ?? 0), 0);
                document.getElementById('stat-storage').textContent = fmtBytes(totalStorage);
                renderUsers(allUsers);
            } catch (e) { console.error(e); }
        }

        async function loadFileStats() {
            try {
                const res = await api.admin.files.list({});
                allFiles = res?.items ?? [];
                filePage = 1;
                document.getElementById('stat-files').textContent = allFiles.length;
                renderAdminFiles();
            } catch (e) { console.error(e); }
        }

        // ── User Management ────────────────────────────────────
        function renderUsers(users) {
            const tbody = document.getElementById('user-list');
            if (!users.length) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="5">ユーザーがいません</td></tr>';
                return;
            }
            tbody.innerHTML = users.map(u => {
                const used = u.storageUsedBytes ?? 0;
                const quota = u.storageLimitBytes ?? 0;
                const usedPct = quota > 0 ? Math.min(100, (used / quota) * 100) : 0;
                return `
                    <tr>
                        <td class="ellipsis-cell" title="${esc(u.username)}"><strong>${esc(u.username)}</strong></td>
                        <td>${u.role === 'admin' ? '<span class="badge badge-gold">admin</span>' : '<span class="badge badge-gray">user</span>'}</td>
                        <td>
                            <div class="admin-usage-inline">
                                <span class="quota-text">${fmtBytes(used)} / ${fmtBytes(quota)}</span>
                                <div class="quota-bar-wrap"><div class="quota-bar" style="width:${usedPct.toFixed(1)}%"></div></div>
                                <span class="file-count-text">${u.fileCount ?? 0}件</span>
                            </div>
                        </td>
                        <td>${u.status === 'active' ? '<span class="badge badge-green">有効</span>' : '<span class="badge badge-red">無効</span>'}</td>
                        <td>
                            <select class="input admin-action-select" data-id="${esc(u.id)}" data-username="${esc(u.username)}" data-quota="${quota}" data-limit="${u.maxFileSizeBytes ?? 0}" data-status="${u.status}" style="width:auto;min-width:110px;font-size:.75rem;padding:.3rem .5rem">
                                <option value="">操作...</option>
                                ${u.status === 'active'
                        ? '<option value="deactivate">無効化</option>'
                        : '<option value="activate">有効化</option>'}
                                <option value="quota">クォータ変更</option>
                                <option value="filelimit">ファイル上限変更</option>
                                <option value="rename">名前変更</option>
                                <option value="rotate-token">トークン再発行</option>
                                <option value="sessions">セッション確認</option>
                                <option value="delete" style="color:var(--red)">削除</option>
                            </select>
                        </td>
                    </tr>`;
            }).join('');

            bindUserEvents();
        }

        function bindUserEvents() {
            document.querySelectorAll('.admin-action-select').forEach(sel => {
                sel.addEventListener('change', async function () {
                    const action = this.value;
                    if (!action) return;
                    this.value = '';
                    const id = this.dataset.id;
                    const username = this.dataset.username;

                    try {
                        switch (action) {
                            case 'deactivate':
                                if (!confirm(`${username} を無効化しますか？`)) return;
                                await api.admin.users.disable(id);
                                break;
                            case 'activate':
                                await api.admin.users.enable(id);
                                break;
                            case 'quota': {
                                const currentMB = Math.round((parseInt(this.dataset.quota, 10) || 0) / 1048576);
                                const input = prompt(`新しいクォータ (MB):\n現在: ${currentMB} MB\n※0=無制限`, currentMB);
                                if (input === null) return;
                                const mb = parseInt(input, 10);
                                if (isNaN(mb) || mb < 0) { alert('無効な値です'); return; }
                                await api.admin.users.storageLimit(id, mb * 1048576);
                                break;
                            }
                            case 'filelimit': {
                                const currentMB = Math.round((parseInt(this.dataset.limit, 10) || 0) / 1048576);
                                const input = prompt(`1ファイル最大サイズ (MB):\n現在: ${currentMB} MB`, currentMB);
                                if (input === null) return;
                                const mb = parseInt(input, 10);
                                if (isNaN(mb) || mb <= 0) { alert('無効な値です'); return; }
                                await api.admin.users.fileLimit(id, mb * 1048576);
                                break;
                            }
                            case 'rename': {
                                const name = prompt('新しいユーザー名:', username);
                                if (!name || !name.trim()) return;
                                await api.admin.users.rename(id, name.trim());
                                break;
                            }
                            case 'rotate-token':
                                if (!confirm(`${username} のログイントークンを再発行しますか？\n既存の全セッションが無効になります。`)) return;
                                const res = await api.admin.users.rotateToken(id);
                                prompt('新しいトークン（コピーしてください）:', res?.login_token ?? res?.loginToken ?? '—');
                                break;
                            case 'sessions': {
                                const sres = await api.admin.users.sessions(id);
                                const items = sres?.items ?? [];
                                if (!items.length) { alert(`${username} のセッションはありません`); return; }
                                const text = items.map(s =>
                                    `• ${s.ip_address ?? '不明'} / ${s.user_agent ? s.user_agent.slice(0, 50) : '—'}\n  作成: ${new Date(s.created_at).toLocaleString('ja-JP')}`
                                ).join('\n\n');
                                alert(`${username} のセッション (${items.length}件):\n\n${text}`);
                                break;
                            }
                            case 'delete':
                                if (!confirm(`「${username}」を完全に削除しますか？\nこの操作は取り消せません。`)) return;
                                await api.admin.users.delete(id);
                                break;
                        }
                        loadStats();
                    } catch { /* ignore */ }
                });
            });
        }

        // ── Create User ────────────────────────────────────────
        document.getElementById('create-user-form').addEventListener('submit', async e => {
            e.preventDefault();
            const username = document.getElementById('new-username').value.trim();
            const role = document.getElementById('new-role').value;
            const msg = document.getElementById('msg');
            if (!username) { msg.textContent = 'ユーザー名を入力してください'; msg.className = 'err'; return; }
            msg.textContent = '';
            try {
                const res = await api.admin.users.create({ username, role });
                const token = res?.login_token;
                msg.textContent = 'ユーザーを作成しました';
                msg.className = 'ok';
                document.getElementById('new-username').value = '';
                if (token) {
                    document.getElementById('new-token-out').value = token;
                    document.getElementById('new-token-area').style.display = '';
                }
                loadStats();
            } catch (err) {
                msg.textContent = err?.message ?? '作成に失敗しました';
                msg.className = 'err';
            }
        });

        document.getElementById('copy-token-btn').addEventListener('click', () => {
            const input = document.getElementById('new-token-out');
            navigator.clipboard.writeText(input.value).catch(() => { });
            const btn = document.getElementById('copy-token-btn');
            btn.textContent = 'コピー済み';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('copied'); }, 2000);
        });

        // ── File Management ────────────────────────────────────
        const FILE_PAGE_SIZE = 100;
        let filePage = 1;

        function renderAdminFiles() {
            const tbody = document.getElementById('admin-file-list');
            const totalPages = Math.max(1, Math.ceil(allFiles.length / FILE_PAGE_SIZE));
            if (filePage > totalPages) filePage = totalPages;
            const start = (filePage - 1) * FILE_PAGE_SIZE;
            const slice = allFiles.slice(start, start + FILE_PAGE_SIZE);

            if (!allFiles.length) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="7">ファイルがありません</td></tr>';
            } else {
                tbody.innerHTML = slice.map(f => {
                    return window.buildFileRow({
                        id: f.id,
                        safe_name: f.safe_name,
                        size: f.size,
                        created_at: f.created_at,
                        expires_at: f.expires_at,
                        owner_username: f.owner_username,
                        public: f.public
                    }, {
                        cbClass: 'admin-file-check',
                        showUser: true,
                        showDl: false
                    });
                }).join('');
            }

            document.getElementById('file-page-info').textContent = allFiles.length > 0
                ? (start + 1) + '\u2013' + Math.min(start + FILE_PAGE_SIZE, allFiles.length) + ' / ' + allFiles.length + '\u4ef6'
                : '0\u4ef6';
            document.getElementById('file-page-prev').disabled = filePage <= 1;
            document.getElementById('file-page-next').disabled = filePage >= totalPages;

            document.querySelectorAll('.fr-del-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm('このファイルを削除しますか？')) return;
                    btn.disabled = true;
                    try {
                        await api.admin.files.delete(btn.dataset.id);
                        allFiles = allFiles.filter(f => f.id !== btn.dataset.id);
                        document.getElementById('stat-files').textContent = allFiles.length;
                        renderAdminFiles();
                    } catch { btn.disabled = false; }
                });
            });

            const selectAll = document.getElementById('admin-select-all');
            if (selectAll) {
                selectAll.checked = false;
                selectAll.onchange = function () {
                    document.querySelectorAll('.admin-file-check').forEach(cb => { cb.checked = this.checked; });
                };
            }
        }

        document.getElementById('file-search-btn').addEventListener('click', async () => {
            const q = document.getElementById('file-search-input').value.trim();
            try {
                const res = await api.admin.files.list({ search: q || undefined });
                allFiles = res?.items ?? [];
                filePage = 1;
                document.getElementById('stat-files').textContent = allFiles.length;
                renderAdminFiles();
            } catch (e) { console.error(e); }
        });

        document.getElementById('file-search-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('file-search-btn').click();
        });

        document.getElementById('file-page-prev').addEventListener('click', () => {
            if (filePage > 1) { filePage--; renderAdminFiles(); }
        });
        document.getElementById('file-page-next').addEventListener('click', () => {
            filePage++; renderAdminFiles();
        });

        // ── Policies ───────────────────────────────────────────
        async function loadPolicies() {
            try {
                const p = await api.admin.policies.get();
                document.getElementById('pol-storage').value = p.defaultStorageLimitBytes ? Math.round(p.defaultStorageLimitBytes / 1048576) : '';
                document.getElementById('pol-filesize').value = p.defaultMaxFileSizeBytes ? Math.round(p.defaultMaxFileSizeBytes / 1048576) : '';
                document.getElementById('pol-expiry').value = p.defaultFileExpiryDays ?? 0;
                document.getElementById('pol-max-expiry').value = p.maxFileExpiryDays ?? 0;
                document.getElementById('pol-session').value = p.sessionTtlSeconds ?? '';
                document.getElementById('pol-chunk').value = p.defaultChunkSizeBytes ? Math.round(p.defaultChunkSizeBytes / 1048576) : '';
                document.getElementById('pol-zip-count').value = p.maxZipFileCount ?? '';
                document.getElementById('pol-zip-size').value = p.maxZipTotalBytes ? Math.round(p.maxZipTotalBytes / 1048576) : '';
            } catch (e) { console.error(e); }
        }

        document.getElementById('policy-form').addEventListener('submit', async e => {
            e.preventDefault();
            const msg = document.getElementById('pol-msg');
            const v = n => { const x = parseFloat(n.value); return isNaN(x) ? undefined : x; };
            const mb = n => { const x = parseFloat(n.value); return isNaN(x) || x <= 0 ? undefined : Math.round(x * 1048576); };
            const payload = {};
            const storage = mb(document.getElementById('pol-storage'));
            if (storage !== undefined) payload.defaultStorageLimitBytes = storage;
            const filesize = mb(document.getElementById('pol-filesize'));
            if (filesize !== undefined) payload.defaultMaxFileSizeBytes = filesize;
            const expiry = v(document.getElementById('pol-expiry'));
            if (expiry !== undefined) payload.defaultFileExpiryDays = expiry === 0 ? null : expiry;
            const maxExpiry = v(document.getElementById('pol-max-expiry'));
            if (maxExpiry !== undefined) payload.maxFileExpiryDays = maxExpiry === 0 ? null : maxExpiry;
            const session = v(document.getElementById('pol-session'));
            if (session !== undefined) payload.sessionTtlSeconds = session;
            const chunk = mb(document.getElementById('pol-chunk'));
            if (chunk !== undefined) payload.defaultChunkSizeBytes = chunk;
            const zipCount = v(document.getElementById('pol-zip-count'));
            if (zipCount !== undefined) payload.maxZipFileCount = zipCount;
            const zipSize = mb(document.getElementById('pol-zip-size'));
            if (zipSize !== undefined) payload.maxZipTotalBytes = zipSize;

            try {
                await api.admin.policies.update(payload);
                msg.textContent = '保存しました';
                msg.style.color = 'var(--green)';
            } catch {
                msg.textContent = '保存に失敗しました';
                msg.style.color = 'var(--red)';
            }
            setTimeout(() => { msg.textContent = ''; }, 3000);
        });

        // ── Init ───────────────────────────────────────────────
        loadStats();
        loadFileStats();
        loadPolicies();

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => { });
    </script>
</body>

</html>
