    <main>

                        <span>›</span>

                    <article class="article-body reveal reveal-d1">
                        <div class="article-header">
                            <div class="article-meta">
                                <span class="news-badge" id="articleBadge"></span>
                                <time class="article-date" id="articleDate"></time>
                            </div>
                            <h1 class="article-title" id="articleTitle"></h1>
                            <p class="article-subtitle" id="articleSubtitle"></p>
                        </div>

                        <div class="article-content" id="articleContent">
                            <!-- MD content rendered here -->
                        </div>
                    </article>

                    <div class="article-footer reveal">

            </div>
        </div>

    <script src="/js/particles.js"></script>
    <script type="module" src="/js/nav.js"></script>
    <script type="module">
        import { auth } from '/js/core/auth.js';

        if (window.__vaArticleInit) throw new Error('already initialized');
        window.__vaArticleInit = true;
        document.addEventListener('va:navigate-away', () => { window.__vaArticleInit = false; });

        if (!auth.requireAuth()) throw new Error('redirect');
        const user = auth.getUser();
        document.getElementById('nav-username').textContent = user?.username ?? '';
        document.getElementById('drawerUsername').textContent = user?.username ?? '';
        if (auth.isAdmin()) document.getElementById('drawer-admin').classList.remove('hidden');

        const TYPE_CLASS = {
            News: 'nb-news',
            Update: 'nb-update',
            Guide: 'nb-guide',
            Note: 'nb-note',
            Danger: 'nb-danger',
        };

        function renderMD(md) {
            return md
                .replace(/^#{3}\s+(.+)$/gm, '<h3>$1</h3>')
                .replace(/^#{2}\s+(.+)$/gm, '<h2>$1</h2>')
                .replace(/^#{1}\s+(.+)$/gm, '<h1>$1</h1>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/`(.+?)`/g, '<code>$1</code>')
                .replace(/^- (.+)$/gm, '<li>$1</li>')
                .replace(/(<li>.*<\/li>\n?)+/g, s => `<ul>${s}</ul>`)
                .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
                .replace(/^(?!<[hulo]).+$/gm, s => s.trim() ? `<p>${s}</p>` : '')
                .replace(/\n{2,}/g, '\n');
        }

        (async () => {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');

            if (!slug) {
                document.getElementById('articleContent').innerHTML =
                    '<p style="color:var(--text-sub)">記事が指定されていません。</p>';
                return;
            }

            try {
                const token = auth.getToken();
                const res = await fetch(`/api/news/articles/${encodeURIComponent(slug)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) {
                    if (res.status === 404) {
                        document.getElementById('articleContent').innerHTML =
                            '<p style="color:var(--text-sub)">記事が見つかりませんでした。</p>';
                    } else {
                        throw new Error(`HTTP ${res.status}`);
                    }
                    return;
                }

                const article = await res.json();

                document.title = `${article.title} — videoapp`;
                document.getElementById('crumbCur').textContent = article.title;

                const typeDisplay = article.type.charAt(0).toUpperCase() + article.type.slice(1);
                const badge = document.getElementById('articleBadge');
                badge.textContent = typeDisplay;
                badge.className = `news-badge ${TYPE_CLASS[typeDisplay] || 'nb-news'}`;

                document.getElementById('articleDate').textContent = article.date;
                document.getElementById('articleTitle').textContent = article.title;
                document.getElementById('articleSubtitle').textContent = article.subtitle;

                document.getElementById('articleContent').innerHTML = renderMD(article.content || '');

                fetch('/api/news/read', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ article_url: slug }),
                }).catch(() => {});

            } catch (e) {
                document.getElementById('articleContent').innerHTML =
                    '<p style="color:var(--text-sub)">記事の読み込みに失敗しました。</p>';
            }
        })();
    </script>
    <script src="/js/dev-reload.js?v=1" defer></script>
