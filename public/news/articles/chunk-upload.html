    <script type="module">
        import { auth } from '/js/core/auth.js';

        if (window.__vaArticleChunkInit) throw new Error('already initialized');
        window.__vaArticleChunkInit = true;
        document.addEventListener('va:navigate-away', () => { window.__vaArticleChunkInit = false; });

        if (!auth.requireAuth()) throw new Error('redirect');
        const user = auth.getUser();
        document.getElementById('nav-username').textContent = user?.username ?? '';
        document.getElementById('drawerUsername').textContent = user?.username ?? '';
        if (auth.isAdmin()) document.getElementById('drawer-admin').classList.remove('hidden');

        const MD_CONTENT = `
## 概要

チャンクアップロード機能を正式に実装しました。従来の単一リクエストによるアップロードに比べ、大容量ファイルの転送が格段に安定しました。

## 変更内容

- **最大ファイルサイズ**: 5GB まで対応
- **チャンクサイズ**: デフォルト10MB（5〜50MBの範囲で調整可能）
- **リアルタイム進捗**: アップロード速度・残り時間・進捗バーをリアルタイム表示
- **エラー時の再試行**: チャンク単位でリトライするため、中断からの復旧が容易

## 使い方

アップロードページで通常通りファイルを選択するだけです。大容量ファイルは自動的にチャンク転送されます。

## 注意事項

- アップロード中はブラウザタブを閉じないでください
- 長時間のアップロードではセッションが切れる場合があります（再ログインが必要）
`;

        document.getElementById('articleContent').innerHTML = renderMD(MD_CONTENT);

        const backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            backToTop.classList.toggle('visible', window.scrollY > 400);
        }, { passive: true });
        backToTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        function renderMD(md) {
            return md
                .replace(/^#{3}\s+(.+)$/gm, '<h3>$1</h3>')
                .replace(/^#{2}\s+(.+)$/gm, '<h2>$1</h2>')
                .replace(/^#{1}\s+(.+)$/gm, '<h1>$1</h1>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/`(.+?)`/g, '<code>$1</code>')
                .replace(/^- (.+)$/gm, '<li>$1</li>')
                .replace(/(<li>.*<\/li>\n?)+/g, s => `<ul>${s}</ul>`)
                .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
                .replace(/^(?!<[hulo]).+$/gm, s => s.trim() ? `<p>${s}</p>` : '')
                .replace(/\n{2,}/g, '\n');
        }
    </script>
