<!DOCTYPE html>
<html lang="ja" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>videoapp — マイファイル</title>
    <link rel="icon" href="/icons/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">
    <script src="/js/nav-theme.js"></script>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/app.css">
    <style>
        .table-wrap {
            overflow-x: hidden;
        }

        .search-row {
            display: flex;
            gap: .5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-row .input {
            min-width: 0;
        }

        .empty-row td {
            padding: 2rem;
            text-align: center;
            color: var(--text-sub);
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <div class="page-glow page-glow-1"></div>
    <div class="page-glow page-glow-2"></div>

    <nav id="nav">
        <a class="nav-logo" href="/">videoapp</a>
        <ul class="nav-links">
            <li><a href="/">ホーム</a></li>
            <li><a href="/upload.html">アップロード</a></li>
            <li><a href="/files.html" class="active">マイファイル</a></li>
            <li><a href="/settings.html">設定</a></li>
            <li id="nav-admin-link" class="hidden"><a href="/admin.html">管理</a></li>
        </ul>
        <div class="nav-user">
            <span id="nav-username"></span>
            <button class="theme-toggle" id="theme-toggle"></button>
            <button class="btn btn-ghost btn-sm" id="logout-btn">ログアウト</button>
        </div>
    </nav>

    <main>
        <div class="container">
            <div class="stat-tag reveal">
                <span class="stat-tag-dot"></span>
                My Files
            </div>

            <div class="sec-eye reveal reveal-d1">
                <div class="sec-eye-text">
                    <div class="sec-lbl">Storage</div>
                    <h1>マイファイル</h1>
                </div>
            </div>

            <div class="card mb-2 reveal reveal-d2">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-sm text-sub">ストレージ使用量</span>
                    <span class="text-sm" id="usage-label">— / —</span>
                </div>
                <div class="usage-bar-wrap">
                    <div class="usage-bar" id="usage-bar" style="width:0%"></div>
                </div>
            </div>

            <div class="search-row reveal reveal-d3">
                <select class="input" id="filter-type" style="width:auto;min-width:120px">
                    <option value="all">すべて</option>
                    <option value="folder">フォルダのみ</option>
                    <option value="file">ファイルのみ</option>
                </select>
                <input class="input" id="search-input" placeholder="ファイル名で検索..." type="search">
                <button class="btn btn-primary" id="search-btn">検索</button>
                <button class="btn btn-danger btn-sm" id="bulk-delete-btn" style="display:none">選択分を削除</button>
            </div>

            <div class="table-wrap reveal reveal-d3">
                <table class="table">
                    <thead>
                        <tr>
                            <th style="width:2rem">
                                <label class="custom-cb" style="padding:0;margin:0">
                                    <input type="checkbox" id="select-all">
                                    <span class="custom-cb-box"></span>
                                </label>
                            </th>
                            <th>ファイル名</th>
                            <th style="width:7rem">サイズ</th>
                            <th style="width:9rem">アップロード日</th>
                            <th style="width:9rem">有効期限</th>
                            <th style="width:7rem">操作</th>
                        </tr>
                    </thead>
                    <tbody id="file-list">
                        <tr class="empty-row">
                            <td colspan="6">読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="flex justify-between items-center mt-1 reveal reveal-d3" style="padding:0 .5rem">
                <span class="text-sm text-sub" id="page-info">0件</span>
                <div style="display:flex;gap:.4rem">
                    <button class="btn btn-ghost btn-sm" id="page-prev">← 前へ</button>
                    <button class="btn btn-ghost btn-sm" id="page-next">次へ →</button>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/particles.js"></script>
    <script src="/js/file-row.js"></script>
    <script type="module">
        import { auth } from '/js/core/auth.js';
        import { api } from '/js/core/api.js';

        if (!auth.requireAuth()) throw new Error('redirect');

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await api.auth.logout().catch(() => { });
            auth.clearSession();
            location.href = '/login.html';
        });

        var PAGE_SIZE = 50;
        var allItems = [];
        var currentPage = 1;

        function fmtBytes(b) {
            if (!b && b !== 0) return '0 B';
            if (b >= 1073741824) return (b / 1073741824).toFixed(2) + ' GB';
            if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
            if (b >= 1024) return (b / 1024).toFixed(0) + ' KB';
            return b + ' B';
        }

        function esc(s) {
            return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ── Init ───────────────────────────────────────────────
        async function init() {
            const me = await api.auth.me();
            auth.updateUser(me);
            document.getElementById('nav-username').textContent = me.username ?? '';
            if (auth.isAdmin()) document.getElementById('nav-admin-link').classList.remove('hidden');

            loadStorageStats();
            loadAllData();

            document.getElementById('search-btn').addEventListener('click', function () { currentPage = 1; applyFilter(); });
            document.getElementById('search-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') { currentPage = 1; applyFilter(); } });
            document.getElementById('search-input').addEventListener('input', function () { currentPage = 1; applyFilter(); });
            document.getElementById('filter-type').addEventListener('change', function () { currentPage = 1; applyFilter(); });

            document.getElementById('page-prev').addEventListener('click', function () {
                if (currentPage > 1) { currentPage--; applyFilter(); }
            });
            document.getElementById('page-next').addEventListener('click', function () {
                var total = Math.ceil(getFilteredItems().length / PAGE_SIZE) || 1;
                if (currentPage < total) { currentPage++; applyFilter(); }
            });

            document.getElementById('select-all').addEventListener('change', function () {
                document.querySelectorAll('.file-check').forEach(function (cb) { cb.checked = this.checked; });
                updateBulkBtn();
            });

            document.getElementById('bulk-delete-btn').addEventListener('click', async function () {
                var checked = Array.from(document.querySelectorAll('.file-check:checked'));
                if (checked.length === 0) return;
                if (!confirm(checked.length + ' 件を削除しますか？')) return;

                var fileIds = checked.filter(function (cb) { return cb.dataset.id.startsWith('f:'); }).map(function (cb) { return cb.dataset.id.slice(2); });
                var folderIds = checked.filter(function (cb) { return cb.dataset.id.startsWith('d:'); }).map(function (cb) { return cb.dataset.id.slice(2); });

                await Promise.all([
                    ...fileIds.map(function (id) { return api.files.delete(id).catch(function () { }); }),
                    ...folderIds.map(function (id) { return api.folders.delete(id).catch(function () { }); }),
                ]);
                loadStorageStats();
                loadAllData();
            });
        }

        // ── Data loading ───────────────────────────────────────
        async function loadStorageStats() {
            try {
                const me = await api.auth.me();
                const res = await api.files.list({ limit: 100 });
                const files = res?.items ?? [];
                var used = files.reduce(function (sum, f) { return sum + (f.size ?? 0); }, 0);
                var limit = me.storage_limit_bytes ?? 0;
                var pct = limit > 0 ? Math.min(100, (used / limit) * 100) : 0;

                document.getElementById('usage-bar').style.width = pct.toFixed(1) + '%';
                document.getElementById('usage-label').textContent =
                    limit > 0 ? fmtBytes(used) + ' / ' + fmtBytes(limit) : fmtBytes(used) + ' / 無制限';
            } catch (e) { console.error(e); }
        }

        async function loadAllData() {
            try {
                const [filesRes, foldersRes] = await Promise.all([
                    api.files.list({ limit: 100 }),
                    api.folders.list(),
                ]);

                var files = (filesRes?.items ?? []).map(function (f) { return Object.assign({ type: 'file' }, f); });
                var folders = (foldersRes?.items ?? []).map(function (d) { return Object.assign({ type: 'folder' }, d); });

                allItems = files.concat(folders);
                allItems.sort(function (a, b) {
                    return new Date(b.created_at) - new Date(a.created_at);
                });

                currentPage = 1;
                applyFilter();
            } catch (e) {
                document.getElementById('file-list').innerHTML = '<tr class="empty-row"><td colspan="6">読み込みに失敗しました</td></tr>';
            }
        }

        // ── Filter & render ────────────────────────────────────
        function getFilteredItems() {
            var searchInput = document.getElementById('search-input').value.trim().toLowerCase();
            var filterType = document.getElementById('filter-type').value;

            var filtered = allItems;

            if (filterType === 'folder') {
                filtered = filtered.filter(function (item) { return item.type === 'folder'; });
            } else if (filterType === 'file') {
                filtered = filtered.filter(function (item) { return item.type === 'file'; });
            }

            if (searchInput) {
                if (searchInput.startsWith('.')) {
                    var ext = searchInput.slice(1);
                    filtered = filtered.filter(function (item) {
                        if (item.type === 'file') {
                            var e = ((item.safe_name || '').split('.').pop() || '').toLowerCase();
                            return e === ext;
                        }
                        return false;
                    });
                } else {
                    filtered = filtered.filter(function (item) {
                        var name = item.type === 'file' ? (item.safe_name || '') : (item.name || 'フォルダ');
                        return name.toLowerCase().includes(searchInput);
                    });
                }
            }
            return filtered;
        }

        function applyFilter() {
            var filtered = getFilteredItems();
            renderList(filtered);
        }

        function renderList(items) {
            var tbody = document.getElementById('file-list');
            var totalPages = Math.ceil(items.length / PAGE_SIZE) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            var start = (currentPage - 1) * PAGE_SIZE;
            var pageItems = items.slice(start, start + PAGE_SIZE);

            document.getElementById('page-info').textContent = items.length > 0
                ? (start + 1) + '–' + Math.min(start + PAGE_SIZE, items.length) + ' / ' + items.length + '件'
                : '0件';
            document.getElementById('page-prev').disabled = currentPage <= 1;
            document.getElementById('page-next').disabled = currentPage >= totalPages;

            if (items.length === 0) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="6">ファイルがありません</td></tr>';
                updateBulkBtn();
                return;
            }

            tbody.innerHTML = pageItems.map(function (item) {
                return window.buildFileRow(item, {
                    cbClass: 'file-check',
                    actionExtras: item.type === 'folder'
                        ? [
                            '<button class="btn btn-ghost btn-sm rename-folder-btn" data-id="' + esc(item.id) + '" data-name="' + esc(item.name) + '" style="padding:.22rem .45rem;font-size:.7rem" title="名前変更">✎</button>'
                        ]
                        : '',
                });
            }).join('');

            document.querySelectorAll('.file-check').forEach(function (cb) {
                cb.addEventListener('change', updateBulkBtn);
            });

            document.querySelectorAll('.fr-del-btn').forEach(function (btn) {
                btn.addEventListener('click', async function () {
                    if (!confirm('このファイルを削除しますか？')) return;
                    btn.disabled = true;
                    try {
                        await api.files.delete(btn.dataset.id);
                        loadStorageStats();
                        loadAllData();
                    } catch (e) { btn.disabled = false; }
                });
            });

            document.querySelectorAll('.fr-del-folder-btn').forEach(function (btn) {
                btn.addEventListener('click', async function () {
                    if (!confirm('このフォルダを削除しますか？')) return;
                    btn.disabled = true;
                    try {
                        await api.folders.delete(btn.dataset.id);
                        loadAllData();
                    } catch (e) { btn.disabled = false; }
                });
            });

            document.querySelectorAll('.rename-folder-btn').forEach(function (btn) {
                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    var name = prompt('新しいフォルダ名:', btn.dataset.name);
                    if (name === null || name.trim() === '') return;
                    api.folders.rename(btn.dataset.id, name.trim()).then(function () {
                        loadAllData();
                    });
                });
            });

            document.getElementById('select-all').checked = false;
            updateBulkBtn();
        }

        function updateBulkBtn() {
            var count = document.querySelectorAll('.file-check:checked').length;
            var btn = document.getElementById('bulk-delete-btn');
            btn.style.display = count > 0 ? '' : 'none';
            btn.textContent = count > 0 ? '選択分を削除 (' + count + ')' : '選択分を削除';
        }

        init();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(function () { });
        }
    </script>
</body>

</html>
