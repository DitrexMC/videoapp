<!DOCTYPE html>
<html lang="ja" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>videoapp — マイファイル</title>
    <link rel="icon" href="/icons/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">
    <script src="/js/nav-theme.js"></script>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/app.css">
    <style>
        .files-toolbar {
            display: flex;
            gap: .5rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: .75rem;
        }

        .files-toolbar .input {
            min-width: 0;
            flex: 1 1 180px;
        }

        .breadcrumb {
            display: none;
            align-items: center;
            gap: .4rem;
            padding: .4rem 0 .6rem;
            font-size: .85rem;
            color: var(--text-sub);
        }

        .breadcrumb.visible {
            display: flex;
        }

        .breadcrumb-sep {
            opacity: .4;
        }

        .breadcrumb-folder {
            font-weight: 600;
            color: var(--text);
        }

        .empty-row td {
            padding: 2.5rem;
            text-align: center;
            color: var(--text-sub);
            font-size: .9rem;
        }

        .table-wrap {
            overflow-x: auto;
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: .5rem .25rem 0;
        }

        .fr-actions {
            white-space: nowrap;
            display: flex;
            gap: .25rem;
            align-items: center;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <div class="page-glow page-glow-1"></div>
    <div class="page-glow page-glow-2"></div>

    <nav id="nav">
        <div class="nav-left">
            <a class="nav-logo" href="/">
                <span class="logo-text">video<em>app</em></span>
            </a>
        </div>
        <ul class="nav-links">
            <li><a href="/">ホーム</a></li>
            <li><a href="/upload.html">アップロード</a></li>
            <li><a href="/files.html" class="active">マイファイル</a></li>
        </ul>
        <div class="nav-right">
            <span id="nav-username" class="nav-username"></span>
            <button class="theme-toggle" id="theme-toggle"></button>
            <button class="nav-hamburger" id="hamburger" aria-label="メニューを開く">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <div class="drawer-overlay" id="drawerOverlay"></div>
    <aside class="nav-drawer" id="navDrawer">
        <div class="drawer-header">
            <span class="drawer-username" id="drawerUsername"></span>
            <button class="drawer-close" id="drawerClose" aria-label="閉じる">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <nav class="drawer-nav">
            <a href="/settings.html" class="drawer-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
                設定
            </a>
            <a href="/news.html" class="drawer-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                    <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                </svg>
                お知らせ
            </a>
            <a href="/admin.html" class="drawer-link hidden" id="drawer-admin">
                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                </svg>
                管理
            </a>
            <a href="/files.html" class="drawer-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
                </svg>
                マイファイル
            </a>
            <a href="/upload.html" class="drawer-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />
                    <polyline points="16 6 12 2 8 6" />
                    <line x1="12" y1="2" x2="12" y2="15" />
                </svg>
                アップロード
            </a>
        </nav>
        <div class="drawer-divider"></div>
        <button class="drawer-logout" id="drawer-logout">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            ログアウト
        </button>
        <div class="drawer-footer">
            <div class="drawer-footer-brand">
                <span class="drawer-footer-logo">video<em>app</em></span>
                <span class="drawer-footer-ver">v1.0</span>
            </div>
            <p class="drawer-footer-desc">プライベートファイルストレージ</p>
            <div class="drawer-footer-credits">

                <span>© 2026 Videoapp</span><span class="dot">·</span>
                <span>DitrexMC</span>
            </div>
        </div>
    </aside>

    <main>
        <div class="container">
            <div class="stat-tag reveal">
                <span class="stat-tag-dot"></span>
                My Files
            </div>

            <div class="sec-eye reveal reveal-d1">
                <div class="sec-eye-text">
                    <div class="sec-lbl">Storage</div>
                    <h1>マイファイル</h1>
                </div>
            </div>

            <!-- Storage bar -->
            <div class="card mb-2 reveal reveal-d2">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-sm text-sub">ストレージ使用量</span>
                    <span class="text-sm" id="usage-label">読み込み中…</span>
                </div>
                <div class="usage-bar-wrap">
                    <div class="usage-bar" id="usage-bar" style="width:0%"></div>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="files-toolbar reveal reveal-d2">
                <select class="input" id="filter-type" style="width:auto;flex:0 0 auto;min-width:130px">
                    <option value="all">すべて</option>
                    <option value="folder">フォルダのみ</option>
                    <option value="file">ファイルのみ</option>
                </select>
                <input class="input" id="search-input" placeholder="ファイル名で検索…" type="search" autocomplete="off">
                <button class="btn btn-ghost btn-sm" id="refresh-btn">更新</button>
                <button class="btn btn-danger btn-sm" id="bulk-delete-btn" style="display:none">選択を削除</button>
            </div>

            <!-- Breadcrumb -->
            <div class="breadcrumb" id="breadcrumb">
                <button class="btn btn-ghost btn-sm" id="breadcrumb-root" style="padding:.15rem .5rem">← マイファイル</button>
                <span class="breadcrumb-sep">/</span>
                <span class="breadcrumb-folder" id="breadcrumb-name"></span>
            </div>

            <!-- Table -->
            <div class="table-wrap reveal reveal-d3">
                <table class="table">
                    <thead>
                        <tr>
                            <th style="width:2rem">
                                <label class="custom-cb" style="padding:0;margin:0">
                                    <input type="checkbox" id="select-all">
                                    <span class="custom-cb-box"></span>
                                </label>
                            </th>
                            <th>ファイル名</th>
                            <th style="width:7rem">サイズ</th>
                            <th style="width:9.5rem">アップロード日</th>
                            <th style="width:9.5rem">有効期限</th>
                            <th style="width:10rem">操作</th>
                        </tr>
                    </thead>
                    <tbody id="file-tbody">
                        <tr class="empty-row">
                            <td colspan="6">読み込み中…</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination reveal reveal-d3">
                <span class="text-sm text-sub" id="page-info">0件</span>
                <div style="display:flex;gap:.4rem">
                    <button class="btn btn-ghost btn-sm" id="page-prev">← 前へ</button>
                    <button class="btn btn-ghost btn-sm" id="page-next">次へ →</button>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/particles.js"></script>
    <script src="/js/file-row.js"></script>
    <script type="module" src="/js/nav.js"></script>
    <script type="module">
        import { auth } from '/js/core/auth.js';
        import { api } from '/js/core/api.js';
        import { cache } from '/js/core/cache.js';

        if (!auth.requireAuth()) throw new Error('auth required');

        // Show cached user immediately — no network wait
        const cachedUser = auth.getUser();
        if (cachedUser) {
            document.getElementById('nav-username').textContent = cachedUser.username ?? '';
            document.getElementById('drawerUsername').textContent = cachedUser.username ?? '';
            if (cachedUser.role === 'admin') {
                document.getElementById('drawer-admin').classList.remove('hidden');
            }
            const used = cachedUser.storage_used_bytes ?? 0;
            const limit = cachedUser.storage_limit_bytes ?? 0;
            const pct = limit > 0 ? Math.min(100, used / limit * 100) : 0;
            document.getElementById('usage-bar').style.width = pct.toFixed(1) + '%';
            document.getElementById('usage-label').textContent =
                limit > 0 ? fmtBytes(used) + ' / ' + fmtBytes(limit) : fmtBytes(used) + ' / 無制限';
        }

        /* ─── state ─────────────────────────────────────────── */
        const PAGE_SIZE = 50;
        let allItems = [];
        let page = 1;
        let folderId = null;
        let folderName = null;

        /* ─── helpers ───────────────────────────────────────── */
        function fmtBytes(b) {
            if (b == null || isNaN(b)) return '0 B';
            if (b >= 1073741824) return (b / 1073741824).toFixed(2) + ' GB';
            if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
            if (b >= 1024) return (b / 1024).toFixed(0) + ' KB';
            return b + ' B';
        }

        function esc(s) {
            return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function filtered() {
            const q = document.getElementById('search-input').value.trim().toLowerCase();
            const t = document.getElementById('filter-type').value;

            return allItems.filter(item => {
                if (t === 'folder' && item.type !== 'folder') return false;
                if (t === 'file' && item.type !== 'file') return false;
                if (!q) return true;
                if (q.startsWith('.')) {
                    if (item.type !== 'file') return false;
                    const ext = (item.safe_name || '').split('.').pop().toLowerCase();
                    return ext === q.slice(1);
                }
                const name = item.type === 'file' ? (item.safe_name || '') : (item.name || '');
                return name.toLowerCase().includes(q);
            });
        }

        /* ─── render ─────────────────────────────────────────── */
        function render() {
            const items = filtered();
            const total = items.length;
            const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
            if (page > totalPages) page = totalPages;

            const start = (page - 1) * PAGE_SIZE;
            const slice = items.slice(start, start + PAGE_SIZE);

            const tbody = document.getElementById('file-tbody');

            if (total === 0) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="6">ファイルがありません</td></tr>';
            } else {
                tbody.innerHTML = slice.map(item => {
                    const extras = [];
                    if (item.type === 'folder') {
                        extras.push('<button class="btn btn-ghost btn-sm fr-rename-btn" data-id="' + esc(item.id) + '" data-name="' + esc(item.name) + '" style="padding:.22rem .45rem;font-size:.74rem" title="名前変更">\u270e</button>');
                    }
                    return window.buildFileRow(item, { cbClass: 'file-cb', actionExtras: extras });
                }).join('');
                tbody.querySelectorAll('tr').forEach((tr, i) => {
                    tr.classList.add('row-reveal');
                    requestAnimationFrame(() => {
                        setTimeout(() => tr.classList.add('visible'), i * 30);
                    });
                });
            }

            document.getElementById('page-info').textContent =
                total > 0 ? (start + 1) + '–' + Math.min(start + PAGE_SIZE, total) + ' / ' + total + '件' : '0件';
            document.getElementById('page-prev').disabled = page <= 1;
            document.getElementById('page-next').disabled = page >= totalPages;
            document.getElementById('select-all').checked = false;

            updateBulkBtn();
            bindRowEvents();
        }

        function bindRowEvents() {
            document.querySelectorAll('.file-cb').forEach(cb =>
                cb.addEventListener('change', updateBulkBtn));

            document.querySelectorAll('.fr-del-btn').forEach(btn =>
                btn.addEventListener('click', async () => {
                    if (!confirm('このファイルを削除しますか？')) return;
                    btn.disabled = true;
                    try { await api.files.delete(btn.dataset.id); await reload(); }
                    catch { btn.disabled = false; }
                }));

            document.querySelectorAll('.fr-del-folder-btn').forEach(btn =>
                btn.addEventListener('click', async () => {
                    if (!confirm('このフォルダを削除しますか？\n中のファイルもすべて削除されます。')) return;
                    btn.disabled = true;
                    try { await api.folders.delete(btn.dataset.id); await reload(); }
                    catch { btn.disabled = false; }
                }));

            document.querySelectorAll('.fr-folder-name').forEach(el =>
                el.addEventListener('click', () => {
                    folderId = el.dataset.folderId;
                    folderName = el.dataset.folderName;
                    page = 1;
                    reload();
                }));

            document.querySelectorAll('.fr-rename-btn').forEach(btn =>
                btn.addEventListener('click', async () => {
                    const name = prompt('新しいフォルダ名:', btn.dataset.name);
                    if (!name || !name.trim()) return;
                    btn.disabled = true;
                    try { await api.folders.rename(btn.dataset.id, name.trim()); await reload(); }
                    catch { alert('名前変更に失敗しました'); btn.disabled = false; }
                }));

            document.querySelectorAll('.fr-discord-btn').forEach(btn =>
                btn.addEventListener('click', async () => {
                    const url = location.origin + btn.dataset.url;
                    const orig = btn.innerHTML;
                    try { await navigator.clipboard.writeText(url); btn.innerHTML = 'コピー済み'; }
                    catch { window.prompt('コピーしてください:', url); }
                    setTimeout(() => { btn.innerHTML = orig; }, 1800);
                }));

            document.querySelectorAll('.fr-urlcopy-btn').forEach(btn =>
                btn.addEventListener('click', async () => {
                    const url = location.origin + btn.dataset.url;
                    const orig = btn.innerHTML;
                    try {
                        await navigator.clipboard.writeText(url); btn.innerHTML = 'コピー完了';
                        setTimeout(() => { btn.innerHTML = orig; }, 1800);
                    } catch { window.prompt('コピーしてください:', url); }
                }));
        }

        function updateBulkBtn() {
            const count = document.querySelectorAll('.file-cb:checked').length;
            const btn = document.getElementById('bulk-delete-btn');
            btn.style.display = count > 0 ? '' : 'none';
            btn.textContent = '選択を削除 (' + count + ')';
        }

        function updateBreadcrumb() {
            const crumb = document.getElementById('breadcrumb');
            if (folderId) {
                document.getElementById('breadcrumb-name').textContent = folderName || 'フォルダ';
                crumb.classList.add('visible');
                document.getElementById('filter-type').style.display = 'none';
            } else {
                crumb.classList.remove('visible');
                document.getElementById('filter-type').style.display = '';
            }
        }

        /* ─── data loading ───────────────────────────────────── */
        async function loadStorage() {
            try {
                const me = await api.auth.me();
                const used = me.storage_used_bytes ?? 0;
                const limit = me.storage_limit_bytes ?? 0;
                const pct = limit > 0 ? Math.min(100, used / limit * 100) : 0;
                document.getElementById('usage-bar').style.width = pct.toFixed(1) + '%';
                document.getElementById('usage-label').textContent =
                    limit > 0 ? fmtBytes(used) + ' / ' + fmtBytes(limit) : fmtBytes(used) + ' / 無制限';
            } catch { /* ignore */ }
        }

        async function loadItems() {
            if (folderId) {
                const res = await api.folders.files(folderId);
                allItems = (res?.items ?? []).map(f => ({
                    id: f.id,
                    safe_name: f.safe_name,
                    size: f.size,
                    created_at: f.created_at,
                    expires_at: f.expires_at,
                    public: f.public,
                    status: f.status,
                    type: 'file'
                }));
            } else {
                const [fRes, dRes] = await Promise.all([
                    api.files.list({ limit: 100 }),
                    api.folders.list(),
                ]);
                const files = (fRes?.items ?? [])
                    .filter(f => !f.folder_id)
                    .map(f => ({
                        id: f.id,
                        safe_name: f.safe_name,
                        size: f.size,
                        created_at: f.created_at,
                        expires_at: f.expires_at,
                        public: f.public,
                        status: f.status,
                        type: 'file'
                    }));
                const folders = (dRes?.items ?? []).map(d => ({
                    id: d.id,
                    name: d.name,
                    created_at: d.created_at,
                    type: 'folder'
                }));
                allItems = [...folders, ...files];
            }
            allItems.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        }

        async function reload() {
            try {
                await Promise.all([loadStorage(), loadItems()]);
            } catch (e) {
                document.getElementById('file-tbody').innerHTML =
                    '<tr class="empty-row"><td colspan="6">読み込みに失敗しました: ' + esc(String(e?.message ?? e)) + '</td></tr>';
                return;
            }
            updateBreadcrumb();
            render();
        }

        /* ─── init ───────────────────────────────────────────── */
        async function init() {
            const me = await api.auth.me();
            auth.updateUser(me);
            document.getElementById('nav-username').textContent = me.username ?? '';
            document.getElementById('drawerUsername').textContent = me.username ?? '';
            if (auth.isAdmin()) document.getElementById('drawer-admin').classList.remove('hidden');

            document.getElementById('breadcrumb-root').addEventListener('click', () => {
                folderId = null; folderName = null; page = 1; reload();
            });

            document.getElementById('refresh-btn').addEventListener('click', () => reload());

            document.getElementById('search-input').addEventListener('input', () => { page = 1; render(); });
            document.getElementById('filter-type').addEventListener('change', () => { page = 1; render(); });

            document.getElementById('page-prev').addEventListener('click', () => { if (page > 1) { page--; render(); } });
            document.getElementById('page-next').addEventListener('click', () => { page++; render(); });

            document.getElementById('select-all').addEventListener('change', function () {
                document.querySelectorAll('.file-cb').forEach(cb => { cb.checked = this.checked; });
                updateBulkBtn();
            });

            document.getElementById('bulk-delete-btn').addEventListener('click', async () => {
                const checked = Array.from(document.querySelectorAll('.file-cb:checked'));
                if (!checked.length) return;
                if (!confirm(checked.length + ' 件を削除しますか？')) return;

                const fileIds = checked.filter(c => c.dataset.id.startsWith('f:')).map(c => c.dataset.id.slice(2));
                const folderIds = checked.filter(c => c.dataset.id.startsWith('d:')).map(c => c.dataset.id.slice(2));

                await Promise.all([
                    ...fileIds.map(id => api.files.delete(id).catch(() => { })),
                    ...folderIds.map(id => api.folders.delete(id).catch(() => { })),
                ]);
                await reload();
            });

            await reload();
        }

        init().catch(e => console.error('init error:', e));

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => { });
        }
    </script>
    <script src="/js/dev-reload.js?v=1" defer></script>
</body>

</html>
